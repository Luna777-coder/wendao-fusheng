<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>问道浮生 · v13 UI 方向预览</title>
<style>
:root{
  --paper:#f2eadb;
  --paper2:#eadfcd;
  --ink:#2b302c;
  --muted:#746f63;
  --red:#843a31;
  --red2:#5f2823;
  --green:#50675a;
  --line:#c6b89f;
  --gold:#9b743a;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  margin:0;
  background:#17201c;
  color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
}
button{font:inherit}
.shell{
  width:min(100vw,720px);
  height:100dvh;
  margin:auto;
  display:grid;
  grid-template-rows:auto 1fr auto;
  background:var(--paper);
  overflow:hidden;
}
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 14px 9px;
  border-bottom:1px solid var(--line);
  background:#efe5d2;
}
.brand h1{
  margin:0;
  color:var(--red);
  font:700 24px/1.1 serif;
}
.version{
  display:inline-block;
  margin-left:5px;
  padding:2px 7px;
  border:1px solid var(--line);
  border-radius:99px;
  background:#fff9ed;
  color:var(--green);
  font:700 11px/1.2 "Microsoft YaHei","PingFang SC",sans-serif;
  vertical-align:middle;
}
.brand p{
  margin:3px 0 0;
  color:var(--muted);
  font-size:11px;
}
.menu{
  width:38px;
  height:38px;
  border:1px solid var(--line);
  border-radius:50%;
  background:#fff9ed;
  color:var(--red);
  font-weight:700;
}
.view{
  min-height:0;
  overflow:auto;
  padding:14px 14px 12px;
  background:#f8f0e3;
}
.meta{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-bottom:8px;
  color:var(--gold);
  font-size:11px;
}
.view h2{
  margin:0 0 10px;
  color:var(--red2);
  font:600 25px/1.2 serif;
}
.lead{
  margin:0 0 12px;
  color:#444941;
  font-size:15px;
  line-height:1.72;
  white-space:pre-line;
}
.summary{
  margin-bottom:12px;
  padding:9px 10px;
  border-left:3px solid var(--green);
  background:#ede3d1;
  color:#4f5b52;
  font-size:13px;
  line-height:1.55;
}
.summary b{color:var(--green)}
.card,.choice,.stat{
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff9ed;
}
.card{
  margin-bottom:8px;
  padding:10px;
}
.card b{
  display:block;
  margin-bottom:4px;
  color:var(--red2);
}
.card small{
  display:block;
  color:var(--muted);
  line-height:1.5;
}
.choice{
  width:100%;
  display:grid;
  grid-template-columns:38px 1fr auto;
  gap:9px;
  align-items:center;
  min-height:52px;
  margin-bottom:8px;
  padding:8px 9px;
  text-align:left;
}
.icon{
  display:grid;
  place-items:center;
  width:36px;
  height:36px;
  border:1px solid #b9a98c;
  border-radius:8px;
  background:#f1e4d2;
  color:var(--red2);
  font-weight:700;
}
.choice strong{
  display:block;
  color:var(--red2);
  font-size:14px;
}
.choice small{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:11px;
  line-height:1.35;
}
.cost{
  color:var(--green);
  font-size:11px;
  white-space:nowrap;
  font-style:normal;
}
.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-bottom:10px;
}
.stat{
  padding:8px 5px;
  text-align:center;
}
.stat b{
  display:block;
  color:var(--red2);
}
.stat span{
  color:var(--muted);
  font-size:10px;
}
.tabs{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  padding:7px 10px calc(8px + var(--safe-bottom));
  border-top:1px solid var(--line);
  background:#ded2bd;
}
.tab{
  min-height:38px;
  border:1px solid #9c8f78;
  border-radius:8px;
  background:#fff9ed;
  color:var(--ink);
  font-size:12px;
  font-weight:700;
}
.tab.active{
  border-color:var(--red);
  background:#ead2c8;
  color:var(--red2);
}
@media(max-width:430px){
  .grid2{grid-template-columns:1fr}
}
@media(max-height:700px){
  .view{padding-top:10px}
  .view h2{font-size:22px;margin-bottom:7px}
  .lead{font-size:14px;line-height:1.62}
  .choice small{display:none}
}
</style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div class="brand">
      <h1>问道浮生 <span class="version">v13 UI 预览</span></h1>
      <p>保留标题行，其余改成分页面主视图</p>
    </div>
    <button class="menu">存</button>
  </header>

  <section class="view" id="view"></section>

  <nav class="tabs">
    <button class="tab active" data-view="action">行动</button>
    <button class="tab" data-view="manage">经营</button>
    <button class="tab" data-view="people">人物</button>
    <button class="tab" data-view="role">角色</button>
    <button class="tab" data-view="record">记录</button>
  </nav>
</main>

<script>
const view = document.getElementById("view");
const pages = {
  action: `
    <div class="meta"><span>青石城 · 破庙后</span><span>浮生1年1月6日 · 薄雾</span></div>
    <h2>破庙后的第一缕灵息</h2>
    <p class="lead">雨刚停，破庙后的泥地还软。你把湿透的袖口拧干，盘坐在半截石阶上，听见城里打更声隔着雾传来。

这一丝灵气并不强，甚至不够照亮指尖。可它顺着胸口往下沉的时候，你第一次觉得自己不是只在青石城讨生活，而是在给日后的路打底。</p>
    <div class="summary"><b>当前目标：</b>完成序章选择，攒钱买第一处建筑。行动页只负责“正在发生什么”和“现在怎么选”。</div>
    <button class="choice"><span class="icon">修</span><span><strong>继续吐纳</strong><small>修为 +10，心性 +1。</small></span><em class="cost">1 行动</em></button>
    <button class="choice"><span class="icon">钱</span><span><strong>回南市找短工</strong><small>铜钱 +18，听见空铺消息。</small></span><em class="cost">1 行动</em></button>
    <button class="choice"><span class="icon">人</span><span><strong>去茶摊打听</strong><small>认识或加深一名 NPC。</small></span><em class="cost">0 行动</em></button>
  `,
  manage: `
    <div class="meta"><span>青石城 · 东街</span><span>经营视图</span></div>
    <h2>产业与生意</h2>
    <p class="lead">这里不再和剧情抢空间，只专门展示建筑、库存、伙计和收益。</p>
    <div class="grid2">
      <div class="card"><b>饭馆 Lv.1</b><small>库存：食材 8｜口碑 2｜伙计 1<br>昨日收入 31 铜钱，食材 -4。</small></div>
      <div class="card"><b>小院</b><small>已拥有｜每日健康恢复 +2<br>可整理住处、存粮、扩建药圃。</small></div>
      <div class="card"><b>茶馆契书</b><small>165 铜钱｜消息流通之地<br>可购买第二处建筑。</small></div>
      <div class="card"><b>药铺契书</b><small>195 铜钱｜伤病生意<br>适合接触异常伤势。</small></div>
    </div>
    <button class="choice"><span class="icon">扫</span><span><strong>打理饭馆</strong><small>口碑 +1，社交 +1。</small></span><em class="cost">1 行动</em></button>
    <button class="choice"><span class="icon">货</span><span><strong>采购食材</strong><small>花 18 铜钱，食材 +10。</small></span><em class="cost">1 行动</em></button>
    <button class="choice"><span class="icon">雇</span><span><strong>招募伙计</strong><small>获得有性格的凡人或修士。</small></span><em class="cost">1 行动</em></button>
  `,
  people: `
    <div class="meta"><span>青石城 · 人物名册</span><span>关系视图</span></div>
    <h2>认识的人</h2>
    <p class="lead">人物页只负责“我认识谁、他们怎么看我、我能和他们做什么”。</p>
    <div class="card"><b>沈祈｜药行跑腿</b><small>信任 12｜亲近 6｜分歧 1<br>见闻：药行今日又来了兽爪外伤。</small></div>
    <button class="choice"><span class="icon">问</span><span><strong>问沈祈外伤消息</strong><small>可能开启北坡准备。</small></span><em class="cost">0 行动</em></button>
    <div class="card"><b>老罗｜脚夫头</b><small>信任 8｜亲近 3｜分歧 0<br>见闻：东街空铺还能压价。</small></div>
    <button class="choice"><span class="icon">谈</span><span><strong>请老罗介绍短工</strong><small>明日工作收益提高。</small></span><em class="cost">0 行动</em></button>
    <div class="card"><b>燕娘｜茶摊老板</b><small>信任 5｜亲近 2｜分歧 0<br>见闻：北坡雾里有人听见低吼。</small></div>
  `,
  role: `
    <div class="meta"><span>角色状态</span><span>凡身 58/100</span></div>
    <h2>你自己</h2>
    <p class="lead">角色页合并玩家属性、修为、装备和背包，避免背包单独占一个主入口。</p>
    <div class="stats">
      <div class="stat"><b>82</b><span>血量</span></div>
      <div class="stat"><b>17</b><span>物攻</span></div>
      <div class="stat"><b>8</b><span>法攻</span></div>
      <div class="stat"><b>11</b><span>防御</span></div>
      <div class="stat"><b>13</b><span>灵智</span></div>
      <div class="stat"><b>12</b><span>潜行</span></div>
      <div class="stat"><b>14</b><span>社交</span></div>
      <div class="stat"><b>16</b><span>体魄</span></div>
      <div class="stat"><b>12</b><span>心性</span></div>
    </div>
    <div class="card"><b>背包</b><small>干粮 x2｜旧锁甲 x1｜北坡线索 x1</small></div>
    <div class="card"><b>修为</b><small>境界：凡身｜进度：58/100｜触到感气需要 100。</small></div>
  `,
  record: `
    <div class="meta"><span>浮生录</span><span>任务与线索</span></div>
    <h2>为什么继续玩</h2>
    <p class="lead">记录页负责目标、线索、战报和阶段主线。玩家不需要在行动页里翻旧账。</p>
    <div class="summary"><b>阶段主线：</b>买下第一处建筑，让它开始赚钱；修行到感气边缘；调查北坡兽影。</div>
    <div class="card"><b>今日记录</b><small>你在破庙后完成一次吐纳，修为 +10，心性 +1。</small></div>
    <div class="card"><b>人物记录</b><small>沈祈提到药行外伤；老罗提到东街空铺；燕娘提到北坡低吼。</small></div>
    <div class="card"><b>战斗记录</b><small>尚未接敌。建议先观察北坡地形或询问沈祈。</small></div>
  `
};

function setView(name){
  view.innerHTML = pages[name];
  document.querySelectorAll(".tab").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.view === name);
  });
}

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => setView(btn.dataset.view));
});
setView("action");
</script>
</body>
</html>
