<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>问道浮生 · 自由行动试玩版</title>
<style>
:root{
  --paper:#f3eddf;
  --paper2:#e5dcc9;
  --ink:#282c29;
  --muted:#737268;
  --red:#843a31;
  --red2:#642a25;
  --green:#53685b;
  --gold:#9d7437;
  --line:#c7baa3;
  --safe-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}
html{background:#17201c}
body{
  margin:0;
  color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  background:#17201c
}
button,input,select{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed;opacity:.45}
.app{
  width:min(100%,720px);
  min-height:100dvh;
  margin:auto;
  padding-bottom:calc(92px + var(--safe-bottom));
  background:var(--paper)
}
.header{
  padding:15px 16px 12px;
  background:#efe7d6;
  border-bottom:1px solid var(--line)
}
.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px
}
.brand h1{
  margin:0;
  color:var(--red);
  font:700 29px/1.1 serif;
  letter-spacing:2px
}
.brand p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:12px
}
.icon-btn{
  width:42px;
  height:42px;
  border:1px solid var(--line);
  border-radius:50%;
  background:#fff9ed;
  color:var(--red);
  font-size:20px
}
.start{
  padding:45px 20px;
  text-align:center
}
.start h2{
  color:var(--red2);
  font:500 28px serif
}
.start p{
  color:var(--muted);
  line-height:1.9
}
.start input{
  width:100%;
  height:50px;
  margin:16px 0 10px;
  padding:0 14px;
  border:1px solid #9b907d;
  border-radius:7px;
  background:#fffaf0
}
.start-actions{display:grid;gap:9px}
.primary{
  border-color:var(--red)!important;
  background:var(--red)!important;
  color:#fff!important
}
.wide{width:100%}
.main-btn{
  min-height:50px;
  padding:10px 14px;
  border:1px solid #958a77;
  border-radius:7px;
  background:#fffaf0;
  color:var(--ink);
  font-weight:700
}
.game{display:none}
.game.active{display:block}
.sticky{
  position:sticky;
  top:0;
  z-index:15;
  padding:9px 12px;
  background:rgba(239,231,214,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px)
}
.progress-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:7px;
  color:var(--muted);
  font-size:12px
}
.progress{
  height:5px;
  border-radius:9px;
  background:#d4c8b4;
  overflow:hidden
}
.progress i{
  display:block;
  height:100%;
  background:var(--red);
  transition:width .3s
}
.stats{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:5px;
  margin-top:8px
}
.stat{
  padding:6px 2px;
  border:1px solid var(--line);
  background:#e4dac7;
  text-align:center;
  border-radius:5px
}
.stat b{
  display:block;
  color:var(--red2);
  font-size:15px
}
.stat span{
  color:var(--muted);
  font-size:9px
}
.content{padding:14px}
.scene{
  padding:18px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff9ed;
  box-shadow:0 8px 24px rgba(62,45,30,.07)
}
.label{
  color:var(--gold);
  font-size:12px;
  letter-spacing:1px
}
.scene h2{
  margin:8px 0 12px;
  color:var(--red2);
  font:500 26px serif
}
.story{
  min-height:118px;
  line-height:1.95;
  white-space:pre-line;
  color:#474a43
}
.goal{
  margin-top:15px;
  padding:11px 12px;
  border-left:3px solid var(--green);
  background:#e9e2d2;
  color:#555b53;
  font-size:13px;
  line-height:1.7
}
.goal b{color:var(--green)}
.assets{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:11px
}
.box{
  padding:11px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#e8dfce
}
.box b{
  display:block;
  margin-bottom:5px;
  color:var(--green);
  font-size:13px
}
.box span{
  color:var(--muted);
  font-size:12px;
  line-height:1.65
}
.free-panel{
  display:none;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  margin-top:11px
}
.free-panel.active{display:grid}
.info-card{
  padding:11px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#eee5d4
}
.info-card b{
  display:block;
  color:var(--red2);
  font-size:13px;
  margin-bottom:5px
}
.info-card span{
  color:var(--muted);
  font-size:12px;
  line-height:1.6
}
.log{
  margin-top:12px;
  padding:12px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:12px;
  line-height:1.8
}
.log b{color:var(--red2)}
.log-list{
  max-height:150px;
  overflow:auto
}
.log-list div{
  padding:3px 0;
  border-bottom:1px dashed #cec1ab
}
.bottom-bar{
  position:fixed;
  z-index:20;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  width:min(100%,720px);
  padding:9px 10px calc(9px + var(--safe-bottom));
  background:rgba(228,218,199,.97);
  border-top:1px solid var(--line);
  backdrop-filter:blur(12px)
}
.bottom-bar button{
  min-height:47px;
  padding:7px 3px;
  border:1px solid #958a77;
  border-radius:7px;
  background:#fff9ed;
  color:var(--ink);
  font-weight:700;
  font-size:13px
}
.overlay{
  position:fixed;
  z-index:100;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:7vh 4vw;
  background:rgba(18,24,21,.48);
  backdrop-filter:blur(7px)
}
.overlay.open{display:flex}
.modal{
  position:relative;
  width:min(94vw,620px);
  max-height:82dvh;
  overflow:auto;
  padding:48px 17px 18px;
  border:1px solid #b7a98e;
  border-radius:13px;
  background:var(--paper);
  box-shadow:0 22px 70px rgba(0,0,0,.32)
}
.close{
  position:absolute;
  top:10px;
  width:36px;
  height:36px;
  border:1px solid var(--line);
  border-radius:50%;
  background:#fff9ed;
  color:var(--red);
  font-size:20px
}
.close.right{right:11px}
.close.left{left:11px}
.modal h2{
  margin:0 42px 7px;
  color:var(--red2);
  font:500 24px serif;
  text-align:center
}
.modal h3{
  margin:18px 0 8px;
  color:var(--green);
  font-size:15px
}
.modal-desc{
  margin:0 0 14px;
  color:var(--muted);
  text-align:center;
  font-size:12px;
  line-height:1.65
}
.choice-list{display:grid;gap:9px}
.choice{
  width:100%;
  min-height:58px;
  padding:11px 13px;
  border:1px solid #9b907d;
  border-radius:8px;
  background:#fff9ed;
  text-align:left;
  color:var(--ink)
}
.choice strong{
  display:block;
  margin-bottom:4px;
  color:var(--red2)
}
.choice small{
  color:var(--muted);
  line-height:1.55
}
.choice em{
  display:block;
  margin-top:5px;
  color:var(--green);
  font-size:11px;
  font-style:normal
}
.choice:active{background:#ded1b8}
.setting{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:13px 3px;
  border-bottom:1px solid var(--line)
}
.setting span{font-size:14px}
.setting select{
  min-width:122px;
  height:40px;
  padding:0 8px;
  border:1px solid #9b907d;
  border-radius:6px;
  background:#fff9ed
}
.toggle{
  width:52px;
  height:30px;
  padding:3px;
  border:0;
  border-radius:18px;
  background:#aaa
}
.toggle i{
  display:block;
  width:24px;
  height:24px;
  border-radius:50%;
  background:#fff;
  transition:.2s
}
.toggle.on{background:var(--green)}
.toggle.on i{transform:translateX(22px)}
.shop-item{
  display:grid;
  grid-template-columns:1fr auto;
  gap:9px;
  align-items:center;
  padding:11px 0;
  border-bottom:1px solid var(--line)
}
.shop-item b{
  display:block;
  color:var(--red2)
}
.shop-item small{
  color:var(--muted);
  line-height:1.5
}
.buy{
  min-width:92px;
  min-height:42px;
  border:1px solid var(--red);
  border-radius:6px;
  background:#fff9ed;
  color:var(--red)
}
.map-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px
}
.map-place{
  min-height:76px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff9ed;
  text-align:left
}
.map-place.active{
  border-color:var(--red);
  background:#eadbca
}
.map-place b{
  display:block;
  color:var(--red2);
  margin-bottom:4px
}
.map-place small{
  color:var(--muted);
  line-height:1.45
}
.save-slot{
  padding:12px 0;
  border-bottom:1px solid var(--line)
}
.save-slot b{
  display:block;
  color:var(--red2);
  margin-bottom:7px
}
.save-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}
.notice{
  margin-top:12px;
  color:var(--muted);
  font-size:12px;
  text-align:center;
  line-height:1.6
}
.danger{
  border-color:#9e4940!important;
  color:#8c3029!important
}
.toast{
  position:fixed;
  z-index:200;
  left:50%;
  bottom:calc(102px + var(--safe-bottom));
  transform:translate(-50%,20px);
  width:min(88vw,480px);
  padding:11px 14px;
  border-radius:8px;
  background:rgba(40,44,41,.94);
  color:#fff;
  text-align:center;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.22s
}
.toast.show{
  opacity:1;
  transform:translate(-50%,0)
}
.motion-dot{
  display:inline-block;
  width:7px;
  height:7px;
  margin-right:5px;
  border-radius:50%;
  background:#6e927a
}
@media(max-width:430px){
  .stats{gap:3px}
  .stat b{font-size:13px}
  .stat span{font-size:8px}
  .assets,.free-panel{grid-template-columns:1fr}
  .story{min-height:140px}
  .scene h2{font-size:23px}
  .bottom-bar button{font-size:12px}
}
@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;transition:none!important}
}
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <div class="header-row">
      <div class="brand">
        <h1>问道浮生</h1>
        <p>一屋二人，山河半生 · 自由行动试玩版</p>
      </div>
      <button class="icon-btn" id="topMenu" aria-label="菜单">☰</button>
    </div>
  </header>

  <section class="start" id="start">
    <h2>从一场相遇开始</h2>
    <p>
      先经历十回合序章，再选择家庭道路与职业专精。<br>
      此后可在青石城中长期生活、谋生、修炼并调查世子之死。
    </p>
    <input id="nameInput" maxlength="8" placeholder="请输入你的名字或道号">
    <div class="start-actions">
      <button class="main-btn primary wide" id="begin">开始新的旅程</button>
      <button class="main-btn wide" id="continueGame" style="display:none">继续自动存档</button>
    </div>
  </section>

  <section class="game" id="game">
    <div class="sticky">
      <div class="progress-row">
        <b id="phaseText">第一回</b>
        <span>
          <i class="motion-dot" id="motionDot"></i>
          <span id="saveText">已自动存档</span>
        </span>
      </div>
      <div class="progress"><i id="progress"></i></div>
      <div class="stats">
        <div class="stat"><b id="coin">60</b><span>铜钱</span></div>
        <div class="stat"><b id="food">12</b><span>食物</span></div>
        <div class="stat"><b id="bond">0</b><span>情谊</span></div>
        <div class="stat"><b id="qi">0</b><span>修为</span></div>
        <div class="stat"><b id="ap">—</b><span>行动力</span></div>
        <div class="stat"><b id="members">2/0</b><span>人口/房位</span></div>
      </div>
    </div>

    <div class="content">
      <article class="scene">
        <div class="label" id="label"></div>
        <h2 id="title"></h2>
        <div class="story" id="story"></div>
        <div class="goal">
          <b>当前目标：</b>
          <span id="goal"></span>
        </div>
      </article>

      <div class="assets">
        <div class="box">
          <b>装备与心法</b>
          <span id="equipment">无</span>
        </div>
        <div class="box">
          <b>永久资产</b>
          <span id="property">尚无房屋</span>
        </div>
      </div>

      <div class="free-panel" id="freePanel">
        <div class="info-card">
          <b>职业与地点</b>
          <span id="careerInfo"></span>
        </div>
        <div class="info-card">
          <b>势力关系</b>
          <span id="factionInfo"></span>
        </div>
        <div class="info-card">
          <b>调查进度</b>
          <span id="caseInfo"></span>
        </div>
        <div class="info-card">
          <b>今日人物</b>
          <span id="npcInfo"></span>
        </div>
      </div>

      <div class="log">
        <b>浮生录</b>
        <div class="log-list" id="logs"></div>
      </div>
    </div>

    <nav class="bottom-bar">
      <button id="mapButton">地图</button>
      <button class="primary" id="actionButton">作出选择</button>
      <button id="shopButton">市集</button>
      <button id="menuButton">菜单</button>
    </nav>
  </section>
</main>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <button class="close right" id="closeModal" aria-label="关闭">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SAVE_KEY = "wendao-fusheng-v5";
const LEGACY_KEY = "wendao-fusheng-v4";
const SLOT_PREFIX = "wendao-fusheng-v5-slot-";

const $ = id => document.getElementById(id);

const weaponNames = ["无", "木剑", "青锋剑", "玄铁剑"];
const armorNames = ["无", "布甲", "皮甲", "玄铁甲"];
const methodNames = ["无", "吐纳诀", "守心诀", "两仪心法"];

const professions = {
  apothecary:{
    name:"药师",
    desc:"药行工作与山野采集收益更高，更容易识别药物和毒理。"
  },
  guard:{
    name:"护卫",
    desc:"巡逻和护送收益更高，可以更早取得巡检司内部消息。"
  },
  scholar:{
    name:"书生",
    desc:"修炼和查阅档案收益更高，更容易分析证词与旧案。"
  }
};

const places = {
  home:{
    name:"住处",
    desc:"陪伴家人、修炼、整理证据和结束一天。"
  },
  market:{
    name:"青石市集",
    desc:"购买物资、打听消息，商旅往来频繁。"
  },
  medicine:{
    name:"回春药行",
    desc:"沈禾工作的药行，也是药材账目汇集之处。"
  },
  guard:{
    name:"巡检司",
    desc:"城防、巡逻和世子出行记录都保存在这里。"
  },
  academy:{
    name:"白鹿书院",
    desc:"收藏医书、地方志和历年案件卷宗。"
  },
  palace:{
    name:"临川王府",
    desc:"世子身亡之地，戒备森严，需要关系或证据。"
  },
  outskirts:{
    name:"城外山野",
    desc:"采集、狩猎、修行，也可能遇见走私者。"
  }
};

const mainTurns = [
  {
    label:"第一回 · 雨巷",
    title:"檐下相逢",
    story:"秋雨封住城门。你在旧茶铺的屋檐下遇见沈禾，她抱着一只装满药草的竹篓，却付不起进城的路钱。\n\n远处巡夜人的灯正慢慢靠近。",
    goal:"决定是否帮助这个陌生人。",
    choices:[
      ["替她支付路钱","你们一同进城，她答应日后偿还。",{coin:-8,bond:4}],
      ["陪她寻找小路","泥泞难行，却让你们有了第一次长谈。",{food:-2,bond:6,qi:1}],
      ["各走各路","你保住了钱财，却记住了她回头时的眼神。",{coin:3,bond:-1}]
    ]
  },
  {
    label:"第二回 · 城南",
    title:"共同谋生",
    story:"三日后，你在城南再次遇见沈禾。她正在药铺门口争取一份短工，掌柜却只肯雇一个人。",
    goal:"在生计和关系之间取得平衡。",
    choices:[
      ["把工作让给她","她有了稳定收入，也开始真正信任你。",{bond:7,food:2}],
      ["提议共同分工","你负责搬货，她负责辨药，掌柜勉强答应。",{coin:12,bond:5,food:-1}],
      ["独自接下工作","你赚到了钱，关系却出现一道细小裂痕。",{coin:18,bond:-4}]
    ]
  },
  {
    label:"第三回 · 药香",
    title:"寒夜发热",
    story:"连日劳作后，沈禾在寒夜里病倒。医馆要收十枚铜钱，市集也能买到便宜但来路不明的药。",
    goal:"让沈禾平安度过这场病。",
    choices:[
      ["请医馆诊治","病很快退去，她把这份照顾记在心里。",{coin:-10,bond:8}],
      ["亲自煎药守夜","你用已有知识照顾她，整夜没有合眼。",{food:-2,bond:6,qi:3}],
      ["购买便宜药物","药有效，却让她多受了两天苦。",{coin:-4,bond:1}]
    ]
  },
  {
    label:"第四回 · 灯火",
    title:"寻常一夜",
    story:"你们围着小炉分食热汤，听屋外风吹过石阶。\n\n没有突发灾祸。这或许是你们第一次感到，日子也可以这样安稳。",
    goal:"让时间自然向前。",
    empty:true
  },
  {
    label:"第五回 · 市集",
    title:"第一笔积蓄",
    story:"药行结算了工钱。沈禾希望先囤食物，你却发现市集里出现了武器、防具、心法和永久房屋居住权。",
    goal:"决定积蓄应该用在哪里。",
    choices:[
      ["优先储备食物","能吃饱，才有资格谈更远的将来。",{coin:-8,food:12,bond:4}],
      ["留钱购买装备","你准备面对城外越来越多的盗匪。",{coin:18,bond:1}],
      ["开始筹备住处","离真正属于你们的房子更近了。",{coin:25,bond:3}]
    ]
  },
  {
    label:"第六回 · 风声",
    title:"山道遇袭",
    story:"送药途中，盗匪封住山道。装备与心法会提供新的解决方式；若什么都没有，只能依靠判断和配合。",
    goal:"保护药材并一同返回城里。",
    dynamic:"bandit"
  },
  {

function freshState(){
  return {
    version:5,
    name:"",
    mode:"prologue",
    turn:0,
    route:"",
    profession:"",
    profXP:0,
    coin:60,
    food:12,
    bond:0,
    qi:0,
    members:2,
    house:false,
    weapon:0,
    armor:0,
    method:0,
    day:1,
    ap:3,
    location:"home",
    factions:{
      medicine:0,
      guard:0,
      academy:0
    },
    npcBond:{
      shen:0,
      xu:0,
      lin:0,
      chen:0,
      yun:0
    },
    clues:[],
    caseResolved:false,
    caseResult:"",
    suspicion:0,
    logs:[],
    settings:{
      closeSide:"right",
      backdrop:true,
      reducedMotion:false
    }
  };
}

let state = freshState();
let toastTimer = 0;

function esc(value){
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function clampState(){
  state.coin = Math.max(0, Number(state.coin) || 0);
  state.food = Math.max(0, Number(state.food) || 0);
  state.qi = Math.max(0, Number(state.qi) || 0);
  state.bond = Math.max(-30, Number(state.bond) || 0);
  state.ap = Math.max(0, Math.min(3, Number(state.ap) || 0));
  state.members = Math.max(2, Math.min(6, Number(state.members) || 2));
}

function mergeState(data){
  const base = freshState();
  return {
    ...base,
    ...data,
    factions:{...base.factions,...(data.factions || {})},
    npcBond:{...base.npcBond,...(data.npcBond || {})},
    settings:{...base.settings,...(data.settings || {})},
    clues:Array.isArray(data.clues) ? data.clues : [],
    logs:Array.isArray(data.logs) ? data.logs : []
  };
}

function migrateLegacy(old){
  const next = freshState();

  next.name = old.name || "无名客";
  next.coin = old.coin ?? 60;
  next.food = old.food ?? 12;
  next.bond = old.bond ?? 0;
  next.qi = old.qi ?? 0;
  next.members = old.members ?? 2;
  next.house = !!old.house;
  next.weapon = old.weapon ?? 0;
  next.armor = old.armor ?? 0;
  next.method = old.method ?? 0;
  next.logs = Array.isArray(old.logs) ? old.logs.slice(0,30) : [];
  next.settings = {
    ...next.settings,
    ...(old.settings || {})
  };

  if(old.phase === "main"){
    next.mode = "prologue";
    next.turn = Math.min(9, old.round || 0);
  }else{
    next.mode = "free";
    next.route = old.route || "couple";
    next.profession = "apothecary";
    next.day = Math.max(1, (old.post || 0) + 1);
    next.ap = 3;
  }

  next.logs.unshift("系统：已将旧版存档迁移到自由行动试玩版。");
  return next;
}

function saveAuto(){
  clampState();
  localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  $("saveText").textContent = "已自动存档";
}

function readAuto(){
  const raw = localStorage.getItem(SAVE_KEY);
  if(raw){
    try{
      return mergeState(JSON.parse(raw));
    }catch(error){
      localStorage.removeItem(SAVE_KEY);
    }
  }

  const legacy = localStorage.getItem(LEGACY_KEY);
  if(legacy){
    try{
      return migrateLegacy(JSON.parse(legacy));
    }catch(error){
      return null;
    }
  }

  return null;
}

function capacity(){
  return state.house ? 6 : 0;
}

function applyEffects(effects = {}){
  ["coin","food","bond","qi"].forEach(key => {
    state[key] += Number(effects[key] || 0);
  });

  if(effects.medicine){
    state.factions.medicine += effects.medicine;
  }
  if(effects.guard){
    state.factions.guard += effects.guard;
  }
  if(effects.academy){
    state.factions.academy += effects.academy;
  }
  if(effects.xp){
    state.profXP += effects.xp;
  }

  clampState();
}

function log(text){
  state.logs.unshift(text);
  state.logs = state.logs.slice(0,60);
}

function showToast(text){
  clearTimeout(toastTimer);
  $("toast").textContent = text;
  $("toast").classList.add("show");
  toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2200);
}

function openModal(html, locked = false){
  $("modalBody").innerHTML = html;
  $("closeModal").className = `close ${state.settings.closeSide}`;
  $("closeModal").style.display = locked ? "none" : "";
  $("overlay").classList.add("open");
}

function closeModal(){
  $("overlay").classList.remove("open");
  $("closeModal").style.display = "";
}

function currentDate(){
  const year = 1 + Math.floor((state.day - 1) / 360);
  const month = 1 + Math.floor(((state.day - 1) % 360) / 30);
  const day = 1 + ((state.day - 1) % 30);
  return `浮生${year}年 ${month}月${day}日`;
}

function weekday(){
  return ((state.day - 1) % 7) + 1;
}

function weekdayName(){
  return ["一","二","三","四","五","六","日"][weekday() - 1];
}

function periodName(){
  if(state.ap === 3) return "清晨";
  if(state.ap === 2) return "午后";
  if(state.ap === 1) return "黄昏";
  return "夜深";
}

function professionRank(){
  if(state.profXP >= 80) return 4;
  if(state.profXP >= 45) return 3;
  if(state.profXP >= 20) return 2;
  return 1;
}

function professionTitle(){
  if(!state.profession) return "尚未选择";
  const rankNames = ["","初习","熟手","行家","名士"];
  return `${rankNames[professionRank()]}${professions[state.profession].name}`;
}

function currentNPCPlace(id){
  const w = weekday();
  const evening = state.ap <= 1;

  if(id === "shen"){
    if(evening) return "home";
    if(state.route === "family" && state.day % 3 === 0) return "home";
    if(w <= 5) return "medicine";
    return w === 6 ? "market" : "outskirts";
  }

  if(id === "xu"){
    if(w <= 5) return state.ap === 3 ? "guard" : "palace";
    return "market";
  }

  if(id === "lin"){
    if(w <= 5) return "academy";
    return w === 6 ? "market" : "home";
  }

  if(id === "chen"){
    return state.ap === 1 ? "medicine" : "market";
  }

  if(id === "yun"){
    if(state.day % 2 === 0 && state.ap >= 2) return "palace";
    return "home";
  }

  return "home";
}

  shen:{name:"沈禾",desc:"与你共同生活的药师。"},
  xu:{name:"徐砚",desc:"负责城南巡逻的年轻校尉。"},

};

function npcsHere(){
  return Object.keys(npcData).filter(id => currentNPCPlace(id) === state.location);
}

function buildBanditChoices(event){
  const choices = [];

  if(state.weapon > 0){
    choices.push([
      "持武器正面威慑",
      "盗匪认出你手中的兵刃，不敢贸然靠近。",
      {coin:8,bond:5}
    ]);
  }

  if(state.armor > 0){
    choices.push([
      "护住沈禾突围",
      "防具挡住了最危险的一击。",
      {food:-2,bond:7,qi:2}
    ]);
  }

  if(state.method > 0){
    choices.push([
      "运转心法寻找破绽",
      "你用修行所得扰乱对方阵脚。",
      {qi:6,bond:4}
    ]);
  }

  choices.push([
    "放下部分药材换取通行",
    "你们平安返回，却损失了货物。",
    {coin:-12,bond:2}
  ]);

  return {...event,choices};
}

function currentPrologue(){
  const event = mainTurns[state.turn];
  if(!event) return null;
  return event.dynamic === "bandit" ? buildBanditChoices(event) : event;
}

    $("phaseText").textContent =
      `${currentDate()} · ${periodName()}`;

    $("progress").style.width = `${(state.ap / 3) * 100}%`;

      `${professionTitle()}｜经验 ${state.profXP}｜当前位置：${places[state.location].name}`;

function openPrologueChoices(){
  const event = currentPrologue();

  let html = `
    <h2>${event.title}</h2>
    <p class="modal-desc">
      ${event.empty
        ? "这是一个平静的过渡回合。"
        : "选择会改变资源、关系与后续可用方案。"}
    </p>
    <div class="choice-list">
  `;

  if(event.empty){
    html += `
      <button class="choice" data-empty="1">
        <strong>让时间继续</strong>
        <small>消耗基本食物，情谊增加 2。</small>
      </button>
    `;
  }else{
    event.choices.forEach((choice,index) => {
      html += `
        <button class="choice" data-choice="${index}">
          <strong>${choice[0]}</strong>
          <small>${choice[1]}</small>
        </button>
      `;
    });
  }

  html += "</div>";
  openModal(html);

  $("modalBody").querySelectorAll("[data-choice]").forEach(button => {
    button.onclick = () => choosePrologue(
      event.choices[Number(button.dataset.choice)]
    );
  });

  const empty = $("modalBody").querySelector("[data-empty]");
  if(empty){
    empty.onclick = () => choosePrologue([
      "平静度过这一夜",
      "",
      {food:-1,bond:2}
    ]);
  }
}

function choosePrologue(choice){
  applyEffects(choice[2]);
  log(`第${state.turn + 1}回合：${choice[0]}。`);
  state.turn++;
  closeModal();

  if(state.turn >= 10){
    state.mode = "route";
    render();
    setTimeout(openRouteChoice,120);
    return;
  }

  render();
}

  openModal(`
    <h2>十回合后的选择</h2>
    <p class="modal-desc">
      这不是结局，而是自由行动阶段的开端。
    </p>
    <div class="choice-list">
      <button class="choice" data-route="family">
        <strong>迎接后代</strong>
        <small>
          家庭人口变为三人，食物消耗增加。

        </small>
      </button>
      <button class="choice" data-route="couple">
        <strong>继续二人世界</strong>
        <small>

        </small>
      </button>

  `, true);

  $("modalBody").querySelectorAll("[data-route]").forEach(button => {
    button.onclick = () => {

      if(state.route === "family"){
        state.members = 3;
        state.food = Math.max(0,state.food - 3);
        state.bond += 5;
        log("十回合后：你们决定迎接一个新的家庭成员。");
      }else{
        state.bond += 6;
        log("十回合后：你们决定继续珍惜二人世界。");
      }

      state.mode = "profession";
      closeModal();
      render();
      setTimeout(openProfessionChoice,120);
    };
  });
}

function openProfessionChoice(){
  let html = `
    <h2>选择职业专精</h2>
    <p class="modal-desc">
      职业会提供长期加成，但不会禁止其他地点的行动。

      </button>
    `;
  });

  html += "</div>";

  $("modalBody").querySelectorAll("[data-profession]").forEach(button => {
    button.onclick = () => {
      state.profession = button.dataset.profession;
      state.mode = "free";
      state.day = 1;
      state.ap = 3;
      state.location = "home";

      if(state.profession === "apothecary"){
        state.factions.medicine += 4;
      }
      if(state.profession === "guard"){
        state.factions.guard += 4;
        state.weapon = Math.max(1,state.weapon);

        state.factions.academy += 4;
        state.qi += 4;

      closeModal();

function openMap(){
  if(state.mode !== "free") return;

  let html = `
    <h2>青石城舆图</h2>
    <p class="modal-desc">
      移动不消耗行动力，但夜深后只能结束当天。
    </p>
    <div class="map-grid">
  `;

  Object.entries(places).forEach(([id,place]) => {
    const locked = id === "palace" &&
      state.factions.guard < 5 &&
      !state.clues.includes("route");

    html += `
      <button
        class="map-place ${state.location === id ? "active" : ""}"
        data-place="${id}"
        ${locked ? "disabled" : ""}
      >
        <b>${place.name}</b>
        <small>
          ${locked
            ? "需要巡检司关系达到 5，或先取得巡夜路线。"
            : place.desc}
        </small>
      </button>
    `;
  });

  html += "</div>";
  openModal(html);

  $("modalBody").querySelectorAll("[data-place]").forEach(button => {
    button.onclick = () => {
      state.location = button.dataset.place;
      closeModal();
      log(`移动：来到${places[state.location].name}。`);
      render();
    };
  });
}

function addClue(id){
  if(state.clues.includes(id)){
    return false;
  }

  state.clues.push(id);
  log(`调查：取得线索“${clueData[id]}”。`);
  showToast(`获得线索：${clueData[id]}`);
  return true;
}

function spendAction(cost,name,effects = {},detail = ""){
  if(state.ap < cost){
    showToast("今日行动力不足");
    return false;
  }

  state.ap -= cost;
  applyEffects(effects);
  log(`${currentDate()}：${name}${detail ? `，${detail}` : ""}。`);
  closeModal();

function talkToNPC(id){
  if(currentNPCPlace(id) !== state.location){
    showToast("此人当前不在这里");
    return;
  }

  if(state.ap < 1){
    showToast("行动力不足");
    return;
  }

  let detail = "";
  const npc = npcData[id];
  state.npcBond[id] += 2;

  if(id === "shen"){
    state.bond += state.route === "couple" ? 5 : 4;
    detail = "你们交换了彼此这一天的见闻";

    if(state.clues.includes("toxin") && !state.clues.includes("herb")){
      addClue("herb");
      detail = "沈禾认出了寒髓散中一种极少见的配药手法";
    }
  }

  if(id === "xu"){
    state.factions.guard += 2;
    detail = "徐砚向你讲起王府当夜混乱的换岗命令";

    if(
      state.factions.guard >= 5 &&
      !state.clues.includes("route")
    ){
      addClue("route");
    }
  }

  if(id === "lin"){
    state.factions.academy += 2;
    state.qi += 1;
    detail = "林见微愿意替你留意被人借走的旧卷宗";
  }

  if(id === "chen"){
    state.factions.medicine += 1;
    state.coin += 3;
    detail = "陈掌柜告诉你，最近有人高价收购北境药材";

    if(!state.clues.includes("seal") && state.day >= 3){
      addClue("seal");
    }
  }

  if(id === "yun"){
    state.bond += 1;
    detail = "云枝终于愿意谈起世子饮下药酒前发生的事";

    if(
      state.clues.includes("cup") &&
      !state.clues.includes("testimony")
    ){
      addClue("testimony");
    }
  }

  state.ap--;
  log(`${currentDate()}：与${npc.name}交谈，${detail}。`);
  closeModal();
  render();

  if(state.ap <= 0){
    setTimeout(openEndDayConfirm,160);
  }
}

function resolveCase(target){
  if(state.ap < 1){
    showToast("今日行动力不足");
    return;
  }

  state.ap--;

  if(target === "gu"){
    const relationTotal =
      state.factions.medicine +
      state.factions.guard +
      state.factions.academy;

    state.caseResolved = true;

    if(state.clues.length >= 8 && relationTotal >= 24){
      state.caseResult = "铁证如山";
      state.coin += 100;
      state.bond += 12;
      state.qi += 10;
      log("世子案：三方势力共同出面。顾惟安及走私同党被捕，案件真相大白。");
    }else{
      state.caseResult = "险中求真";
      state.coin += 65;
      state.bond += 8;
      state.qi += 6;
      log("世子案：证据足以击破顾惟安的辩解，但仍有部分同党逃离青石城。");
    }

    closeModal();
    render();
    openModal(`
      <h2>${state.caseResult}</h2>
      <p class="modal-desc">
        世子并非死于急病。顾惟安借北境商队运入寒髓散，
        又利用内府身份调走守卫，把毒物混入药酒。
      </p>
      <div class="goal">
        <b>调查完成：</b>
        你仍可继续自由生活、提升职业、经营家庭和购买永久房屋。
      </div>
      <button class="main-btn primary wide" id="continueLife">继续生活</button>
    `);

    $("continueLife").onclick = closeModal;
  }else{
    state.suspicion += 2;
    state.factions.guard = Math.max(-10,state.factions.guard - 2);
    log("世子案：这次指控无法解释所有证据，幕后之人的警觉提高了。");
    closeModal();
    render();
    showToast("指控错误，仍可继续调查");
  }
}

        </small>

    </div>
  `);

function endDay(){
  const foodNeed = Math.max(2,Math.ceil(state.members * .8));
  let report = [];

  if(state.food >= foodNeed){
    state.food -= foodNeed;
    report.push(`家庭消耗 ${foodNeed} 份食物。`);
  }else{
    const shortage = foodNeed - state.food;
    state.food = 0;
    state.bond -= 2 + shortage;
    report.push(`食物不足 ${shortage} 份，家庭情谊受到影响。`);
  }

  if(!state.house && state.day % 5 === 0){
    const rent = 6;

    if(state.coin >= rent){
      state.coin -= rent;
      report.push(`支付租金 ${rent} 枚铜钱。`);
    }else{
      state.coin = 0;
      state.bond -= 3;
      report.push("无力足额支付租金，房东再次催促。");
    }
  }

  const eventText = randomDailyEvent();
  report.push(eventText);

  state.day++;
  state.ap = 3;
  state.location = "home";

  log(`${currentDate()}：新的一天开始。${eventText}`);
  closeModal();
  render();

  openModal(`
    <h2>一日结算</h2>
    <p class="modal-desc">${currentDate()} · 星期${weekdayName()}</p>
    <div class="goal">
      ${report.map(item => `<div>• ${esc(item)}</div>`).join("")}
    </div>
    <button class="main-btn primary wide" id="startNewDay">开始今日</button>
  `);

  $("startNewDay").onclick = closeModal;
}

    },
    {
      name:"永久房屋居住权",
      desc:state.house
        ? "已拥有，最多六人永久居住。"
        : "免除定期租金，最多容纳六人。",
      cost:120,
      max:state.house,
      buy:() => state.house = true
    }
  ];
}

function openShop(){
  const products = shopProducts();

  let html = `
    <h2>青石市集</h2>
    <p class="modal-desc">
      购买不消耗行动力。现有 ${state.coin} 枚铜钱。
    </p>
  `;

  products.forEach((product,index) => {
    html += `
      <div class="shop-item">
        <div>
          <b>${product.name}</b>
          <small>${product.desc}</small>
        </div>
        <button
          class="buy"
          data-buy="${index}"
          ${product.max || state.coin < product.cost ? "disabled" : ""}
        >
          ${product.max ? "已拥有" : `${product.cost} 铜钱`}
        </button>
      </div>
    `;
  });

  openModal(html);

  $("modalBody").querySelectorAll("[data-buy]").forEach(button => {
    button.onclick = () => buyProduct(Number(button.dataset.buy));
  });
}

function buyProduct(index){
  const product = shopProducts()[index];

  if(product.max || state.coin < product.cost){
    return;
  }

  state.coin -= product.cost;
  product.buy();
  log(`市集：购买${product.name}。`);
  saveAuto();
  render();
  openShop();
}

function saveSlot(index){
  localStorage.setItem(
    SLOT_PREFIX + index,
    JSON.stringify({
      savedAt:new Date().toLocaleString(),
      state
    })
  );
  showToast(`已保存到存档槽 ${index}`);
  openMenu();
}

function loadSlot(index){
  const raw = localStorage.getItem(SLOT_PREFIX + index);

  if(!raw){
    showToast("该存档槽为空");
    return;
  }

  try{
    const data = JSON.parse(raw);
    state = mergeState(data.state || data);
    closeModal();
    enterGame();
    render();
    showToast(`已读取存档槽 ${index}`);
  }catch(error){
    showToast("存档损坏，无法读取");
  }
}

function deleteSlot(index){
  if(!localStorage.getItem(SLOT_PREFIX + index)){
    return;
  }

  if(confirm(`确定清除存档槽 ${index} 吗？`)){
    localStorage.removeItem(SLOT_PREFIX + index);
    openMenu();
  }
}

function slotInfo(index){
  const raw = localStorage.getItem(SLOT_PREFIX + index);

  if(!raw){
    return "空存档";
  }

  try{
    const data = JSON.parse(raw);
    const saved = data.state || data;
    return `${data.savedAt || "旧存档"}｜${saved.name || "无名客"}｜${
      saved.mode === "free"
        ? `自由生活第 ${saved.day || 1} 日`
        : `序章第 ${(saved.turn || 0) + 1} 回合`
    }`;
  }catch(error){
    return "损坏的存档";
  }
}

function openMenu(){
  let slots = "";

  for(let i = 1;i <= 3;i++){
    slots += `
      <div class="save-slot">
        <b>存档槽 ${i}</b>
        <div class="notice" style="text-align:left;margin:0 0 8px">
          ${esc(slotInfo(i))}
        </div>
        <div class="save-actions">
          <button class="main-btn" data-save="${i}">保存</button>
          <button class="main-btn" data-load="${i}">读取</button>
        </div>
        <button
          class="main-btn danger wide"
          style="margin-top:7px;min-height:40px"
          data-delete="${i}"
        >清除该槽</button>
      </div>
    `;
  }

  openModal(`
    <h2>旅程菜单</h2>
    <p class="modal-desc">
      自动存档会持续更新。手动存档槽彼此独立。
    </p>

    ${slots}

    <h3>界面设置</h3>

    <div class="setting">
      <span>关闭按钮位置</span>
      <select id="sideSelect">
        <option value="left">左上角</option>
        <option value="right">右上角</option>
      </select>
    </div>

    <div class="setting">
      <span>点击弹窗外关闭</span>
      <button class="toggle ${state.settings.backdrop ? "on" : ""}" id="backdropToggle">
        <i></i>
      </button>
    </div>

    <button class="main-btn danger wide" id="restartGame" style="margin-top:18px">
      清除自动存档并重新开始
    </button>
  `);

  $("sideSelect").value = state.settings.closeSide;

  $("sideSelect").onchange = event => {
    state.settings.closeSide = event.target.value;
    $("closeModal").className = `close ${event.target.value}`;
    saveAuto();
  };

  $("backdropToggle").onclick = event => {
    state.settings.backdrop = !state.settings.backdrop;
    event.currentTarget.classList.toggle("on",state.settings.backdrop);
    saveAuto();
  };

  $("modalBody").querySelectorAll("[data-save]").forEach(button => {
    button.onclick = () => saveSlot(button.dataset.save);
  });

  $("modalBody").querySelectorAll("[data-load]").forEach(button => {
    button.onclick = () => loadSlot(button.dataset.load);
  });

  $("modalBody").querySelectorAll("[data-delete]").forEach(button => {
    button.onclick = () => deleteSlot(button.dataset.delete);
  });

  $("restartGame").onclick = () => {
    if(confirm("确定清除自动存档并重新开始吗？手动存档槽不会被删除。")){
      localStorage.removeItem(SAVE_KEY);
      localStorage.removeItem(LEGACY_KEY);
      location.reload();
    }
  };
}

function mainAction(){
  if(state.mode === "prologue"){
    openPrologueChoices();
  }else if(state.mode === "route"){
    openRouteChoice();
  }else if(state.mode === "profession"){
    openProfessionChoice();
  }else{
    openLocationActions();
  }
}

function enterGame(){
  $("start").style.display = "none";
  $("game").classList.add("active");
}

$("begin").onclick = () => {
  const manualSlotsExist = [1,2,3].some(index =>
    localStorage.getItem(SLOT_PREFIX + index)
  );

  if(
    (localStorage.getItem(SAVE_KEY) || manualSlotsExist) &&
    !confirm("开始新旅程会覆盖自动存档，但不会删除手动存档槽。确定继续吗？")
  ){
    return;
  }

  state = freshState();
  state.name = $("nameInput").value.trim() || "无名客";
  log(`${state.name}踏入青石城，旅程由此开始。`);
  enterGame();
  render();
};

$("continueGame").onclick = () => {
  const loaded = readAuto();

  if(!loaded){
    showToast("没有可读取的自动存档");
    return;
  }

  state = loaded;
  enterGame();
  render();
};

$("actionButton").onclick = mainAction;
$("mapButton").onclick = openMap;
$("shopButton").onclick = openShop;
$("menuButton").onclick = openMenu;
$("topMenu").onclick = openMenu;
$("closeModal").onclick = closeModal;

$("overlay").onclick = event => {
  if(
    event.target === $("overlay") &&
    state.settings.backdrop &&
    $("closeModal").style.display !== "none"
  ){
    closeModal();
  }
};

let lastFrame = 0;
let dotPhase = 0;

function animationLoop(time){
  if(time - lastFrame >= 33){
    lastFrame = time;
    dotPhase = (dotPhase + 1) % 100;

    if(!state.settings.reducedMotion){
      $("motionDot").style.opacity =
        String(.45 + .55 * Math.sin(dotPhase / 12) ** 2);
    }
  }

  requestAnimationFrame(animationLoop);
}

requestAnimationFrame(animationLoop);

const existing = readAuto();

if(existing){
  $("continueGame").style.display = "";
  $("continueGame").textContent =
    existing.mode === "free"
      ? `继续：自由生活第 ${existing.day || 1} 日`
      : `继续：序章第 ${(existing.turn || 0) + 1} 回合`;
}
</script>
</body>
</html>
