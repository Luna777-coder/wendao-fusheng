<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修行小队 - 据点养成</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main id="game-container">
        <section id="resource-bar" aria-label="资源">
            <div class="resource-item"><span>灵石</span><strong id="money">1000</strong></div>
            <div class="resource-item"><span>装备</span><strong id="equipment-count">0</strong></div>
            <div class="resource-item"><span>据点</span><strong id="hideout-count">1</strong></div>
            <div class="resource-item"><span>天气</span><strong id="weather">晴朗 / 第 1 天</strong></div>
        </section>

        <section id="main-view">
            <div id="team-panel">
                <h1>当前小队</h1>
                <div id="team-members"></div>
                <button id="recruit-btn" class="action-btn">招募成员 500 灵石</button>
            </div>

            <div id="mission-panel">
                <h1>任务大厅</h1>
                <div id="mission-list"></div>
            </div>
        </section>

        <section id="dialog-overlay" class="hidden" aria-label="角色互动窗口">
            <div id="dialog-box">
                <div id="dialog-character">
                    <div id="character-avatar"></div>
                    <div>
                        <h2 id="character-name"></h2>
                        <p id="character-status"></p>
                    </div>
                </div>
                <p id="dialog-content"></p>
                <div id="dialog-choices"></div>
            </div>
        </section>

        <div id="notification" class="hidden"></div>
    </main>

    <script src="game.js"></script>
</body>
</html>
