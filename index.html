<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>问道浮生 · v10 中配体验版</title>
<style>
:root{
  --paper:#f2eadb;
  --paper2:#eadfcd;
  --ink:#2b302c;
  --muted:#746f63;
  --red:#843a31;
  --red2:#5f2823;
  --green:#50675a;
  --line:#c6b89f;
  --gold:#9b743a;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  margin:0;
  background:#17201c;
  color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
}
button,input,select{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
.app{
  width:min(100vw,720px);
  height:100dvh;
  margin:auto;
  background:var(--paper);
  overflow:hidden;
}
.start{
  height:100%;
  overflow:auto;
  padding:28px 18px calc(24px + var(--safe-bottom));
}
.start h1{
  margin:0;
  color:var(--red);
  font:700 32px/1.1 serif;
}
.version{
  display:inline-block;
  margin-left:6px;
  padding:2px 7px;
  border:1px solid var(--line);
  border-radius:99px;
  background:#fff9ed;
  color:var(--green);
  font:700 11px/1.2 "Microsoft YaHei","PingFang SC",sans-serif;
  vertical-align:middle;
}
.start-intro{
  margin:10px 0 16px;
  color:var(--muted);
  font-size:14px;
  line-height:1.8;
}
.form-card,.card,.choice,.timeline-item{
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff9ed;
}
.form-card{
  padding:14px;
}
.field{margin-bottom:12px}
.field label{
  display:block;
  margin-bottom:6px;
  color:var(--green);
  font-size:13px;
  font-weight:700;
}
.field input,.field select{
  width:100%;
  height:44px;
  padding:0 11px;
  border:1px solid #9b907d;
  border-radius:7px;
  background:#fffaf0;
  color:var(--ink);
}
.field small{
  display:block;
  margin-top:5px;
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}
.branch-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.branch{
  min-height:70px;
  padding:9px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fffaf0;
  text-align:left;
}
.branch.active{
  border-color:var(--red);
  background:#ead2c8;
}
.branch.locked{opacity:.5;filter:grayscale(.35)}
.branch b{
  display:block;
  color:var(--red2);
}
.branch small{
  color:var(--muted);
  line-height:1.45;
}
.main-btn{
  min-height:48px;
  padding:10px 14px;
  border:1px solid #958a77;
  border-radius:7px;
  background:#fffaf0;
  color:var(--ink);
  font-weight:700;
}
.primary{border-color:var(--red)!important;background:var(--red)!important;color:#fff!important}
.wide{width:100%}
.start-actions{
  display:grid;
  gap:9px;
  margin-top:13px;
}
.game{
  display:none;
  height:100%;
  grid-template-rows:auto auto minmax(184px,33dvh) auto 1fr;
  overflow:hidden;
}
.game.active{display:grid}
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px 14px 9px;
  border-bottom:1px solid var(--line);
  background:#efe5d2;
}
.brand h1{
  margin:0;
  color:var(--red);
  font:700 25px/1.1 serif;
}
.brand p{
  margin:3px 0 0;
  color:var(--muted);
  font-size:11px;
}
.icon-btn{
  width:40px;
  height:40px;
  border:1px solid var(--line);
  border-radius:50%;
  background:#fff9ed;
  color:var(--red);
  font-size:18px;
}
.status{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:5px;
  padding:8px 10px;
  border-bottom:1px solid var(--line);
  background:var(--paper2);
}
.stat{
  min-width:0;
  padding:6px 2px;
  border:1px solid var(--line);
  border-radius:6px;
  background:#fff8eb;
  text-align:center;
}
.stat b{
  display:block;
  color:var(--red2);
  font-size:14px;
  line-height:1.1;
  white-space:nowrap;
}
.stat span{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:9px;
}
.scene{
  min-height:0;
  padding:12px 14px 11px;
  border-bottom:1px solid var(--line);
  background:#f8f0e3;
  overflow:hidden;
}
.scene-head{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-bottom:5px;
  color:var(--gold);
  font-size:11px;
}
.scene h2{
  margin:0 0 6px;
  color:var(--red2);
  font:600 21px/1.18 serif;
}
.scene-text{
  max-height:58px;
  overflow:hidden;
  color:#4a4e48;
  font-size:13px;
  line-height:1.5;
}
.scene-summary{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:start;
  margin-top:8px;
  padding:8px 9px;
  border:1px solid #cdbb9d;
  border-radius:8px;
  background:#fff9ed;
}
.scene-summary b{
  display:block;
  margin-bottom:2px;
  color:var(--green);
  font-size:13px;
}
.scene-summary span{
  color:#555b53;
  font-size:12px;
  line-height:1.4;
}
.scene-summary em{
  font-style:normal;
  color:var(--red2);
  font-weight:700;
  font-size:13px;
  white-space:nowrap;
}
.goal{
  margin-top:7px;
  padding-left:8px;
  border-left:3px solid var(--green);
  color:#4f5b52;
  font-size:12px;
  line-height:1.4;
}
.tabs{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  padding:7px 10px 8px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:#ded2bd;
}
.tab{
  position:relative;
  min-height:38px;
  border:1px solid #9c8f78;
  border-radius:8px;
  background:#fff9ed;
  color:var(--ink);
  font-weight:700;
  font-size:12px;
}
.tab.active{
  border-color:var(--red);
  background:#ead2c8;
  color:var(--red2);
}
.dot{
  position:absolute;
  top:-5px;
  right:-4px;
  min-width:16px;
  height:16px;
  border:2px solid #ded2bd;
  border-radius:9px;
  background:#b52e28;
  color:#fff;
  font:700 9px/12px sans-serif;
}
.panel{
  min-height:0;
  padding:10px 12px calc(10px + var(--safe-bottom));
  overflow:auto;
  background:var(--paper);
}
.panel h3{
  margin:0 0 8px;
  color:var(--red2);
  font:600 18px serif;
}
.panel-desc{
  margin:0 0 9px;
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}
.choice{
  width:100%;
  display:grid;
  grid-template-columns:42px 1fr;
  gap:10px;
  align-items:center;
  min-height:58px;
  margin-bottom:8px;
  padding:9px 10px;
  text-align:left;
}
.choice:active{transform:translateY(1px);background:#f3e3d1}
.icon{
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  border:1px solid #b9a98c;
  border-radius:8px;
  background:#f1e4d2;
  color:var(--red2);
  font-weight:700;
}
.choice strong,.card b,.timeline-item b{
  display:block;
  color:var(--red2);
  margin-bottom:4px;
}
.choice small,.card small,.timeline-item small{
  display:block;
  color:var(--muted);
  line-height:1.5;
}
.card,.timeline-item{
  margin-bottom:8px;
  padding:10px;
}
.grid2,.attrs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.attrs{grid-template-columns:repeat(3,1fr)}
.attr{
  padding:7px 5px;
  border:1px solid #d0c0a7;
  border-radius:7px;
  background:#fff9ed;
  text-align:center;
}
.attr b{display:block;color:var(--red2)}
.attr span{font-size:10px;color:var(--muted)}
.factor{
  display:grid;
  grid-template-columns:52px 1fr;
  gap:8px;
  margin-bottom:6px;
  font-size:12px;
  line-height:1.45;
}
.factor span{
  color:#fff;
  text-align:center;
  border-radius:99px;
  padding:2px 6px;
  background:var(--green);
}
.factor.minus span{background:var(--red)}
.toast{
  position:fixed;
  z-index:20;
  left:50%;
  bottom:calc(88px + var(--safe-bottom));
  transform:translate(-50%,20px);
  width:min(88vw,480px);
  padding:11px 14px;
  border-radius:8px;
  background:rgba(40,44,41,.95);
  color:#fff;
  text-align:center;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-height:700px){
  .game{grid-template-rows:auto auto minmax(166px,30dvh) auto 1fr}
  .brand h1{font-size:22px}
  .scene h2{font-size:20px}
  .scene-text{max-height:40px}
  .scene-summary{padding:6px 8px}
  .tabs{padding-top:6px;padding-bottom:7px}
}
@media(max-width:430px){
  .branch-grid{grid-template-columns:1fr}
  .stat b{font-size:13px}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main class="app">
  <section class="start" id="start">
    <h1>问道浮生 <span class="version">v10 中配体验版</span></h1>
    <p class="start-intro">
      这一版把前期主线改为：在青石城立足，买下第一处建筑，经营产业，修行到感气边缘，并完成北坡首战。
      王子旧案和两国战争只作为背景，等修为更高后再进入主线。
    </p>
    <div class="form-card">
      <div class="field">
        <label for="nameInput">名字或道号</label>
        <input id="nameInput" maxlength="8" placeholder="例如：云归">
      </div>
      <div class="field">
        <label for="genderInput">性别</label>
        <select id="genderInput">
          <option value="male">男</option>
          <option value="female">女</option>
        </select>
      </div>
      <div class="field">
        <label for="loveInput">情感倾向</label>
        <select id="loveInput">
          <option value="male">男</option>
          <option value="female">女</option>
          <option value="bi">双</option>
          <option value="unknown">暂不清楚</option>
        </select>
        <small>这只影响恋爱可能，不影响友情、合伙、雇佣和师友关系。</small>
      </div>
      <div class="field">
        <label>初始成长方向</label>
        <div class="branch-grid" id="careerGrid"></div>
      </div>
      <div class="field">
        <label>细分方向</label>
        <div class="branch-grid" id="branchGrid"></div>
        <small>灰色隐藏职业仅展示存在感，正式解锁需要后续事件。</small>
      </div>
    </div>
    <div class="start-actions">
      <button class="main-btn primary wide" id="newGame">开始 v10 体验</button>
      <button class="main-btn wide" id="continueGame" style="display:none">继续自动存档</button>
      <button class="main-btn wide" id="clearSave">清除自动存档</button>
    </div>
  </section>

  <section class="game" id="game">
    <header class="top">
      <div class="brand">
        <h1>问道浮生 <span class="version">v10</span></h1>
        <p id="subtitle">浮生1年1月1日 · 青石城</p>
      </div>
      <button class="icon-btn" id="saveBtn" aria-label="保存">存</button>
    </header>
    <section class="status" id="status"></section>
    <section class="scene">
      <div class="scene-head">
        <span id="place">青石城 · 城门</span>
        <span id="meta">清晨 · 客商入城</span>
      </div>
      <h2 id="sceneTitle">初到青石城</h2>
      <div class="scene-text" id="sceneText"></div>
      <div class="scene-summary">
        <div>
          <b id="summaryTitle">当前重点</b>
          <span id="summaryText">先安顿下来，找到第一份稳定收入。</span>
        </div>
        <em id="summaryTag">立足</em>
      </div>
      <div class="goal" id="goal">目标：攒钱买下第一处建筑。</div>
    </section>
    <nav class="tabs">
      <button class="tab active" data-tab="action">行动<span class="dot" id="actionDot">!</span></button>
      <button class="tab" data-tab="manage">经营<span class="dot" id="manageDot">!</span></button>
      <button class="tab" data-tab="bag">背包</button>
      <button class="tab" data-tab="person">人物</button>
      <button class="tab" data-tab="map">地图</button>
    </nav>
    <section class="panel" id="panel"></section>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
const SAVE_KEY = "wendao-fusheng-v10";
const VERSION = "v10 中配体验版";

const careers = {
  soldier:{
    name:"兵修",
    desc:"正面对抗、护卫、狩猎、守店。",
    branches:["灵剑","狂刀","枪神","棍舞","拳客"],
    hidden:["兽兵：地武/海灵/天幕"],
    attrs:{hp:86, physical:18, magic:6, defense:14, wisdom:10, stealth:10, social:11, body:18, mind:12}
  },
  mage:{
    name:"法修",
    desc:"灵力推演、术法、异常调查。",
    branches:["焚烬","幽溟","苍雷"],
    hidden:["兽语者","疗愈者"],
    attrs:{hp:74, physical:8, magic:18, defense:8, wisdom:18, stealth:10, social:12, body:11, mind:17}
  },
  shadow:{
    name:"影修",
    desc:"潜入、追踪、情报、先手处理。",
    branches:["隐弓","咒刃"],
    hidden:["伪装者"],
    attrs:{hp:78, physical:13, magic:8, defense:9, wisdom:14, stealth:19, social:13, body:13, mind:15}
  }
};

const buildings = {
  courtyard:{name:"小院", cost:160, desc:"安稳住处", bonus:"每日健康恢复 +2，可扩建药圃。"},
  restaurant:{name:"饭馆", cost:180, desc:"小本饭食生意", bonus:"消耗食物转化铜钱，容易认识凡人伙计。"},
  weapon:{name:"武器铺", cost:210, desc:"修士与护卫常来", bonus:"更容易获得武器、护卫委托和兵修事件。"},
  medicine:{name:"药铺", cost:200, desc:"药材与伤病生意", bonus:"治疗方便，容易接触异常伤势。"},
  teahouse:{name:"茶馆", cost:170, desc:"消息流通之地", bonus:"情报收益高，容易触发传闻。"},
  bookshop:{name:"书斋", cost:190, desc:"账簿、经文、文书", bonus:"灵智成长快，调查和推理更稳定。"}
};

const $ = id => document.getElementById(id);
let chosenCareer = "soldier";
let chosenBranch = "灵剑";
let state = null;
let toastTimer = null;

function freshState(){
  const c = careers[chosenCareer];
  return {
    player:{
      name:$("nameInput").value.trim() || "无名客",
      gender:$("genderInput").value,
      love:$("loveInput").value,
      career:chosenCareer,
      careerName:c.name,
      branch:chosenBranch
    },
    day:1,
    ap:5,
    coin:120,
    food:12,
    health:86,
    realm:"凡身",
    qi:20,
    spirit:2,
    tab:"action",
    stage:"settle",
    place:"青石城 · 城门",
    meta:"清晨 · 客商入城",
    title:"初到青石城",
    text:"青石城不大，却挤满了战后迁来的手艺人、脚夫和修士。城墙外贴着王国征募令，茶棚里有人低声谈到十年前的王子旧案。你现在还插不上那样的事，眼前最要紧的是站稳脚跟。",
    summaryTitle:"当前重点",
    summaryText:"攒钱买第一处建筑，先拥有自己的落脚点和收入来源。",
    summaryTag:"立足",
    goal:"攒钱买下第一处建筑。",
    companion:{name:"沈祈", job:"药行跑腿", income:9, trust:12, closeness:8, conflict:0, last:"沈祈说药行最近常见外伤客，像是城外有什么东西惊了人。"},
    buildings:[],
    activeBuilding:null,
    business:{},
    employees:[],
    items:["干粮 x2"],
    flags:{heardBeast:false, inspectedSlope:false, firstBattle:false, battleDone:false, ending:false},
    attrs:{...c.attrs},
    log:["你进入青石城。远处战鼓只是背景，眼下你需要先活成自己的样子。"],
    npcNotes:["沈祈与你同租一间旧屋。关系可以发展成伙伴、朋友或更亲近的人，但不强制。"],
    saveVersion:VERSION
  };
}

function save(){
  if(!state) return;
  localStorage.setItem(SAVE_KEY, JSON.stringify(state));
}

function load(){
  const raw = localStorage.getItem(SAVE_KEY);
  if(!raw) return null;
  try{return JSON.parse(raw)}catch{return null}
}

function toast(text){
  $("toast").textContent = text;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>$("toast").classList.remove("show"),1600);
}

function log(text){
  state.log.unshift(text);
  state.log = state.log.slice(0,10);
}

function setScene({place,meta,title,text,summaryTitle,summaryText,summaryTag,goal}){
  Object.assign(state,{place,meta,title,text,summaryTitle,summaryText,summaryTag,goal});
}

function spendAp(cost=1){
  if(state.ap < cost){
    toast("今日行动力不足");
    return false;
  }
  state.ap -= cost;
  return true;
}

function nextDay(){
  const foodNeed = 1 + (state.companion ? 1 : 0);
  state.day += 1;
  state.ap = 5;
  state.food -= foodNeed;
  state.coin += state.companion.income;
  state.companion.last = random([
    `沈祈从${state.companion.job}回来，交给你 ${state.companion.income} 枚铜钱，说今日有个护卫腰侧被兽爪撕开。`,
    `沈祈今日帮药行送药，听说北坡废亭附近有拖痕，像魂兽受伤后留下的。`,
    `沈祈把收入交给你打理，又提醒你：若真要出城，至少带药或找人同行。`
  ]);
  log(`新的一天：食物 -${foodNeed}，沈祈交给你 ${state.companion.income} 枚铜钱。${state.companion.last}`);

  if(state.food < 0){
    state.food = 0;
    state.health -= 12;
    state.companion.trust = Math.max(0, state.companion.trust - 2);
    log("你们饿了一夜。沈祈没有无动于衷，他把剩下的药汤分给你，但语气明显不高兴。健康 -12，信任 -2。");
  }else if(state.food <= 3){
    state.health -= 3;
    log("食物已经很少，沈祈劝你明日先补粮。健康 -3。");
  }else{
    state.health = Math.min(100, state.health + (state.buildings.includes("courtyard") ? 3 : 1));
  }

  settleBusiness();
  if(state.day >= 3 && !state.flags.heardBeast){
    state.flags.heardBeast = true;
    log("茶馆传开北坡兽影。你可以在行动页打听或准备出城。");
  }
  save();
  render();
}

function settleBusiness(){
  if(!state.activeBuilding) return;
  const b = state.business[state.activeBuilding];
  const income = Math.max(4, b.level * 10 + b.reputation * 2 + b.employees.length * 4 - Math.max(0, 10 - b.inventory));
  b.inventory = Math.max(0, b.inventory - 3);
  state.coin += income;
  b.last = `${buildings[state.activeBuilding].name}今日进账 ${income} 枚铜钱。客流${random(["清淡","平稳","热闹"])}，库存余 ${b.inventory}。`;
  log(`经营结算：${b.last}`);
}

function random(arr){return arr[Math.floor(Math.random()*arr.length)]}

function beginGame(){
  state = freshState();
  $("start").style.display = "none";
  $("game").classList.add("active");
  save();
  render();
}

function enterLoaded(data){
  state = data;
  $("start").style.display = "none";
  $("game").classList.add("active");
  render();
}

function renderCareer(){
  $("careerGrid").innerHTML = Object.entries(careers).map(([id,c])=>`
    <button class="branch ${chosenCareer===id?"active":""}" data-career="${id}">

    </button>
  `).join("");
  $("careerGrid").querySelectorAll("[data-career]").forEach(btn=>{
    btn.onclick = ()=>{
      chosenCareer = btn.dataset.career;
      chosenBranch = careers[chosenCareer].branches[0];

    };
  });
  const c = careers[chosenCareer];
  $("branchGrid").innerHTML = c.branches.map(name=>`
    <button class="branch ${chosenBranch===name?"active":""}" data-branch="${name}">
      <b>${name}</b><small>可作为本次体验初始分支。</small>
    </button>
  `).join("") + c.hidden.map(name=>`
    <button class="branch locked" disabled><b>${name}</b><small>隐藏职业，后续事件解锁。</small></button>
  `).join("");

      chosenBranch = btn.dataset.branch;
      renderCareer();
    };
  });
}

function battleScore(action){
  let score = 42;
  const plus = [];
  const minus = [];
  if(state.player.career === "soldier"){score += 8; plus.push("兵修基础：更适合正面承压 +8")}
  if(state.player.career === "mage" && action === "soothe"){score += 8; plus.push("法修灵智：更易读懂伤势 +8")}
  if(state.player.career === "shadow" && action === "ambush"){score += 8; plus.push("影修身法：设伏先手更稳 +8")}
  if(state.flags.inspectedSlope){score += 12; plus.push("提前看过地形：塌墙可限制突进 +12")}
  if(state.buildings.length){score += 5; plus.push("已有产业：心态更稳，不急于冒险 +5")}
  if(state.realm === "感气边缘"){score += 8; plus.push("感气边缘：能察觉魂兽气息 +8")}
  if(action === "stand"){score += 8; plus.push("迎击：调用体魄、防御、物攻 +8")}
  if(action === "ambush"){score += state.flags.inspectedSlope ? 12 : 4; plus.push(state.flags.inspectedSlope ? "设伏：地形准备完整 +12" : "临时设伏：准备不足 +4")}
  if(action === "soothe"){score += state.attrs.social >= 13 ? 9 : 0; plus.push("安抚：社交与灵智参与判定 +9")}
  if(action === "run"){score = 76; plus.push("主动撤离：目标改为保命，成功率较高")}
  if(state.health < 70){score -= 8; minus.push("健康偏低：动作迟缓 -8")}
  if(!state.items.some(x=>x.includes("药")) && action !== "run"){score -= 5; minus.push("没有外伤药：容错降低 -5")}
  return {score:Math.max(18,Math.min(95,score)), plus, minus};
}

function bestBattleScore(){
  return Math.max(...["stand","ambush","soothe","run"].map(a=>battleScore(a).score));
}

function resolveBattle(action){
  const data = battleScore(action);
  let title,text,reward;
  if(action === "run"){
    title = "撤离成功";
    text = "你没有逞强，沿来路慢慢退下山坡。魂兽没有追出太远，只在雾里低吼。";
    reward = "保住健康，获得北坡危险情报。";
    state.health -= 1;
  }else if(data.score >= 75){
    title = "小胜";
    text = action === "soothe"
      ? "你没有先动手，而是绕开它的伤口低声安抚。魂兽最终退入林中，留下几片带灵气的鳞。"
      : "你抓住它突进后的停顿，借塌墙和兵器逼退了它。它没有死，却记住了你的气息。";
    reward = "获得魂兽鳞片、北坡线索、修为进度 +8，沈祈信任 +2。";
    state.spirit += 1;
    state.qi = Math.min(100,state.qi + 8);
    state.companion.trust += 2;
    state.items.push("魂兽鳞片 x1","北坡线索 x1");
  }else if(data.score >= 50){
    title = "险胜";
    text = "你挡住最危险的一次冲撞，但手臂被震得发麻。魂兽拖着伤腿逃走，地上留下一道黑色血痕。";
    reward = "健康 -8，获得黑血线索、修为进度 +5。";
    state.health -= 8;
    state.qi = Math.min(100,state.qi + 5);
    state.items.push("黑血线索 x1");
  }else{
    title = "被救";
    text = "你判断慢了一步，魂兽从雾中撞来。沈祈把你拖到塌墙后，才避开第二次扑击。";
    reward = "健康 -16，欠沈祈一次人情。";
    state.health -= 16;
    state.companion.trust += 1;
  }
  state.flags.firstBattle = true;
  state.flags.battleDone = true;
  state.flags.ending = true;
  state.stage = "ending";
  setScene({
    place:"城外 · 北坡归途",
    meta:"首战结束 · 可回城",
    title,
    text,
    summaryTitle:"本次收获",
    summaryText:reward,
    summaryTag:`判定 ${data.score}%`,
    goal:"体验版主线完成：立足、买建筑、经营、修行、北坡首战。"
  });
  log(`北坡首战：${title}。${reward}`);
  render();
}

  state.coin -= b.cost;
  state.buildings.push(id);
  state.activeBuilding = id;
  state.business[id] = {level:1, reputation:1, inventory:10, employees:[], last:"刚买下，还没有正式开张。"};

function manageAction(type){
  if(!state.activeBuilding){toast("还没有建筑");return}
  if(!spendAp()) return;
  const b = state.business[state.activeBuilding];
  const name = buildings[state.activeBuilding].name;
  if(type === "tidy"){
    b.reputation += 1;
    state.attrs.social += 1;
    setScene({place:`青石城 · ${name}`,meta:"白日 · 打理门面",title:"亲自把铺子擦亮",text:`你整理门面、擦净桌案，也和路过的客人聊了几句。${name}的口碑还很小，但已经有人记住这里。`,summaryTitle:"经营反馈",summaryText:"口碑 +1，社交 +1。明日结算收益会提高。",summaryTag:"口碑+",goal:"继续经营、补货或雇佣伙计。"});
    log(`经营：打理${name}，口碑 +1，社交 +1。`);
  }
  if(type === "stock"){
    if(state.coin < 18){toast("补货需要 18 铜钱");state.ap++;return}
    state.coin -= 18;
    b.inventory += 12;
    setScene({place:`青石城 · ${name}`,meta:"午后 · 补货",title:"补上一批库存",text:"你跑了两处摊位才压下价格。货架重新满起来，心里也踏实一些。",summaryTitle:"经营反馈",summaryText:"铜钱 -18，库存 +12。库存会影响每日收益。",summaryTag:"库存+",goal:"等待明日收益，或继续经营。"});
    log(`经营：为${name}补货，库存 +12。`);
  }
  if(type === "recruit"){
    if(state.coin < 20){toast("招募需要 20 铜钱");state.ap++;return}
    state.coin -= 20;
    const emp = randomEmployee();
    b.employees.push(emp);
    state.employees.push(emp);
    setScene({place:`青石城 · ${name}`,meta:"午后 · 招募",title:`${emp.name}前来应聘`,text:`${emp.name}是${emp.type}，性格${emp.personality}。优点是${emp.strength}，缺点是${emp.weakness}。${emp.name}愿意先试工三日。`,summaryTitle:"人物加入",summaryText:`伙计 +1，每日经营收益提高。工资：${emp.wage} 铜钱。`,summaryTag:"雇佣",goal:"观察伙计表现，继续经营产业。"});
    log(`雇佣：${emp.type}${emp.name}加入${name}。`);
  }
  render();
}

    <h3>背包 / 储物</h3>
    <p class="panel-desc">战斗和经营获得的物品、线索、装备都放在这里。</p>
    ${state.items.map(item=>`<div class="card"><b>${item}</b><small>${itemDesc(item)}</small></div>`).join("")}
  `;
}

function itemDesc(item){
  if(item.includes("鳞片")) return "可出售、入药或研究，后续可开启魂兽相关事件。";
  if(item.includes("线索")) return "已加入记录，可能影响北坡后续调查。";
  if(item.includes("干粮")) return "出城和长途行动的基础补给。";
  if(item.includes("药")) return "可降低危险行动后的伤势。";
  return "普通物品。";
}

function renderPerson(){
  return `
    <h3>人物与属性</h3>
    <p class="panel-desc">${state.player.name}｜${state.player.careerName}/${state.player.branch}。外属性六维和内属性三维已经接入事件判定。</p>
    <div class="card"><b>外属性六维</b><div class="attrs">
      ${[
        ["血量",state.attrs.hp],["物理攻击",state.attrs.physical],["魔法攻击",state.attrs.magic],
        ["防御",state.attrs.defense],["灵智",state.attrs.wisdom],["潜行闪避",state.attrs.stealth]
      ].map(([n,v])=>`<div class="attr"><b>${v}</b><span>${n}</span></div>`).join("")}
    </div></div>
    <div class="card"><b>内属性三维</b><div class="attrs">
      ${[["社交",state.attrs.social],["体魄",state.attrs.body],["心性",state.attrs.mind]].map(([n,v])=>`<div class="attr"><b>${v}</b><span>${n}</span></div>`).join("")}
    </div></div>
    <div class="card"><b>沈祈</b><small>工作：${state.companion.job}｜每日交给你打理 ${state.companion.income} 铜钱。<br>信任 ${state.companion.trust}｜亲近 ${state.companion.closeness}｜分歧 ${state.companion.conflict}<br>${state.companion.last}</small></div>
    ${state.employees.map(e=>`<div class="card"><b>${e.name}</b><small>${e.type}伙计｜${e.personality}｜优点：${e.strength}｜缺点：${e.weakness}｜工资 ${e.wage}</small></div>`).join("")}
  `;
}

function renderMap(){
  return `
    <h3>地图与记录</h3>
    <p class="panel-desc">本体验版完整剧情线：青石城立足，购买建筑，经营修行，北坡首战。</p>
    <div class="card"><b>剧情线</b><small>1. 初到青石城，先不介入国家大事。<br>2. 工作、经营、修行，攒钱买第一处建筑。<br>3. 沈祈通过药行收入与见闻参与日常。<br>4. 北坡传闻出现，玩家可准备后出城。<br>5. 首战后获得线索/战利品，体验版结束。</small></div>
    ${state.log.map((x,i)=>`<div class="timeline-item"><b>${i===0?"最新记录":"记录"}</b><small>${x}</small></div>`).join("")}
  `;
}

$("newGame").onclick = beginGame;
$("continueGame").onclick = ()=>{const data=load(); if(data) enterLoaded(data)};
$("clearSave").onclick = ()=>{localStorage.removeItem(SAVE_KEY); toast("自动存档已清除"); $("continueGame").style.display="none"};
$("saveBtn").onclick = ()=>{save(); toast("已保存")};
document.querySelectorAll(".tab").forEach(btn=>btn.onclick=()=>setTab(btn.dataset.tab));

renderCareer();
const existing = load();
if(existing){
  $("continueGame").style.display = "";
  $("continueGame").textContent = `继续：第 ${existing.day||1} 日 · ${existing.saveVersion||"旧版存档"}`;
}
</script>
</body>
</html>
