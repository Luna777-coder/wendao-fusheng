<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>问道浮生 · 人物关系与生存重构版</title>
<style>
:root{
  --paper:#f3eddf;
  --paper2:#e5dcc9;
  --ink:#282c29;
  --muted:#737268;
  --red:#843a31;
  --red2:#642a25;
  --green:#53685b;
  --gold:#9d7437;
  --line:#c7baa3;
  --blue:#506b78;
  --safe-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}
html{background:#17201c}
body{
  margin:0;
  color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  background:#17201c
}
button,input,select{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed;opacity:.42}
.app{
  width:min(100%,720px);
  min-height:100dvh;
  margin:auto;
  padding-bottom:calc(94px + var(--safe-bottom));
  background:var(--paper)
}
.header{
  padding:15px 16px 12px;
  background:#efe7d6;
  border-bottom:1px solid var(--line)
}
.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px
}
.brand h1{
  margin:0;
  color:var(--red);
  font:700 29px/1.1 serif;
  letter-spacing:2px
}
.brand p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:12px
}
.icon-btn{
  position:relative;
  width:42px;
  height:42px;
  border:1px solid var(--line);
  border-radius:50%;
  background:#fff9ed;
  color:var(--red);
  font-size:20px
}
.start{
  padding:38px 20px 42px;
  text-align:center
}
.start h2{
  margin:8px 0 12px;
  color:var(--red2);
  font:500 28px serif
}
.start-intro{
  color:var(--muted);
  line-height:1.85;
  font-size:14px
}
.creator{
  margin-top:22px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff9ed;
  text-align:left
}
.field{margin-bottom:13px}
.field:last-child{margin-bottom:0}
.field label{
  display:block;
  margin-bottom:6px;
  color:var(--green);
  font-size:13px;
  font-weight:700
}
.field input,.field select{
  width:100%;
  height:46px;
  padding:0 12px;
  border:1px solid #9b907d;
  border-radius:7px;
  background:#fffaf0;
  color:var(--ink)
}
.field small{
  display:block;
  margin-top:5px;
  color:var(--muted);
  font-size:11px;
  line-height:1.5
}
.start-actions{
  display:grid;
  gap:9px;
  margin-top:13px
}
.primary{
  border-color:var(--red)!important;
  background:var(--red)!important;
  color:#fff!important
}
.wide{width:100%}
.main-btn{
  min-height:50px;
  padding:10px 14px;
  border:1px solid #958a77;
  border-radius:7px;
  background:#fffaf0;
  color:var(--ink);
  font-weight:700
}
.game{display:none}
.game.active{display:block}
.sticky{
  position:sticky;
  top:0;
  z-index:15;
  padding:9px 12px;
  background:rgba(239,231,214,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px)
}
.progress-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:7px;
  color:var(--muted);
  font-size:12px
}
.progress{
  height:5px;
  border-radius:9px;
  background:#d4c8b4;
  overflow:hidden
}
.progress i{
  display:block;
  height:100%;
  background:var(--red);
  transition:width .3s
}
.stats{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:5px;
  margin-top:8px
}
.stat{
  padding:6px 2px;
  border:1px solid var(--line);
  border-radius:5px;
  background:#e4dac7;
  text-align:center
}
.stat b{
  display:block;
  color:var(--red2);
  font-size:14px
}
.stat span{
  color:var(--muted);
  font-size:9px
}
.stat.warning{background:#ead4c4}
.stat.danger{background:#dfb9ad}
.content{padding:14px}
.guide{
  display:none;
  margin-bottom:11px;
  padding:12px 13px;
  border:1px solid #b38b51;
  border-radius:8px;
  background:#f1e3c4;
  color:#5c513f;
  font-size:13px;
  line-height:1.65
}
.guide.active{display:block}
.guide-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:5px
}
.guide-head b{color:var(--red2)}
.guide-head span{
  color:var(--gold);
  font-size:11px
}
.scene{
  padding:18px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff9ed;
  box-shadow:0 8px 24px rgba(62,45,30,.07)
}
.label{
  color:var(--gold);
  font-size:12px;
  letter-spacing:1px
}
.scene h2{
  margin:8px 0 12px;
  color:var(--red2);
  font:500 26px serif
}
.story{
  min-height:120px;
  line-height:1.95;
  white-space:pre-line;
  color:#474a43
}
.goal{
  margin-top:15px;
  padding:11px 12px;
  border-left:3px solid var(--green);
  background:#e9e2d2;
  color:#555b53;
  font-size:13px;
  line-height:1.7
}
.goal b{color:var(--green)}
.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:11px
}
.card{
  padding:11px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#e8dfce
}
.card b{
  display:block;
  margin-bottom:5px;
  color:var(--green);
  font-size:13px
}
.card span{
  color:var(--muted);
  font-size:12px;
  line-height:1.65
}
.free-only{display:none}
.free-only.active{display:grid}
.log{
  margin-top:12px;
  padding:12px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:12px;
  line-height:1.8
}
.log>b{color:var(--red2)}
.log-list{
  max-height:150px;
  overflow:auto
}
.log-list div{
  padding:3px 0;
  border-bottom:1px dashed #cec1ab
}
.bottom-bar{
  position:fixed;
  z-index:20;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  width:min(100%,720px);
  padding:9px 10px calc(9px + var(--safe-bottom));
  background:rgba(228,218,199,.97);
  border-top:1px solid var(--line);
  backdrop-filter:blur(12px)
}
.nav-btn{
  position:relative;
  min-height:48px;
  padding:7px 3px;
  border:1px solid #958a77;
  border-radius:7px;
  background:#fff9ed;
  color:var(--ink);
  font-size:12px;
  font-weight:700
}
.badge{
  position:absolute;
  top:-5px;
  right:-4px;
  display:none;
  min-width:17px;
  height:17px;
  padding:0 4px;
  border:2px solid #e4dac7;
  border-radius:10px;
  background:#b52e28;
  color:#fff;
  font:700 10px/13px sans-serif;
  text-align:center
}
.badge.show{display:block}
.overlay{
  position:fixed;
  z-index:100;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:6vh 4vw;
  background:rgba(18,24,21,.48);
  backdrop-filter:blur(7px)
}
.overlay.open{display:flex}
.modal{
  position:relative;
  width:min(94vw,620px);
  max-height:84dvh;
  overflow:auto;
  padding:48px 17px 18px;
  border:1px solid #b7a98e;
  border-radius:13px;
  background:var(--paper);
  box-shadow:0 22px 70px rgba(0,0,0,.32)
}
.close{
  position:absolute;
  top:10px;
  width:36px;
  height:36px;
  border:1px solid var(--line);
  border-radius:50%;
  background:#fff9ed;
  color:var(--red);
  font-size:20px
}
.close.right{right:11px}
.close.left{left:11px}
.modal h2{
  margin:0 42px 7px;
  color:var(--red2);
  font:500 24px serif;
  text-align:center
}
.modal h3{
  margin:18px 0 8px;
  color:var(--green);
  font-size:15px
}
.modal-desc{
  margin:0 0 14px;
  color:var(--muted);
  text-align:center;
  font-size:12px;
  line-height:1.65
}
.choice-list{
  display:grid;
  gap:9px
}
.choice{
  width:100%;
  min-height:58px;
  padding:11px 13px;
  border:1px solid #9b907d;
  border-radius:8px;
  background:#fff9ed;
  text-align:left;
  color:var(--ink)
}
.choice strong{
  display:block;
  margin-bottom:4px;
  color:var(--red2)
}
.choice small{
  display:block;
  color:var(--muted);
  line-height:1.55
}
.choice em{
  display:block;
  margin-top:5px;
  color:var(--green);
  font-size:11px;
  font-style:normal
}
.choice .risk{color:#9a5037}
.choice:active{background:#ded1b8}
.result-box{
  margin:12px 0;
  padding:13px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff9ed;
  line-height:1.75;
  font-size:13px
}
.result-box.success{border-left:4px solid var(--green)}
.result-box.fail{border-left:4px solid var(--red)}
.relationship{
  padding:12px 0;
  border-bottom:1px solid var(--line)
}
.relationship-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px
}
.relationship-head b{color:var(--red2)}
.relationship-head span{
  color:var(--muted);
  font-size:12px
}
.meter-row{
  display:grid;
  grid-template-columns:44px 1fr 30px;
  align-items:center;
  gap:7px;
  margin:6px 0;
  color:var(--muted);
  font-size:11px
}
.meter{
  height:7px;
  overflow:hidden;
  border-radius:10px;
  background:#d6cab7
}
.meter i{
  display:block;
  height:100%;
  background:var(--green)
}
.map-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px
}
.map-place{
  position:relative;
  min-height:82px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff9ed;
  text-align:left
}
.map-place.active{
  border-color:var(--red);
  background:#eadbca
}
.map-place b{
  display:block;
  margin-bottom:4px;
  color:var(--red2)
}
.map-place small{
  color:var(--muted);
  line-height:1.45
}
.map-dot{
  position:absolute;
  top:7px;
  right:7px;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#b52e28;
  box-shadow:0 0 0 3px rgba(181,46,40,.13)
}
.shop-item{
  display:grid;
  grid-template-columns:1fr auto;
  gap:9px;
  align-items:center;
  padding:11px 0;
  border-bottom:1px solid var(--line)
}
.shop-item b{
  display:block;
  color:var(--red2)
}
.shop-item small{
  color:var(--muted);
  line-height:1.5
}
.buy{
  min-width:92px;
  min-height:42px;
  border:1px solid var(--red);
  border-radius:6px;
  background:#fff9ed;
  color:var(--red)
}
.task{
  padding:11px 0;
  border-bottom:1px solid var(--line)
}
.task b{
  display:block;
  margin-bottom:4px;
  color:var(--red2)
}
.task small{
  color:var(--muted);
  line-height:1.55
}
.task.done{opacity:.58}
.clue{
  padding:10px;
  margin-bottom:8px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fff9ed
}
.clue b{
  display:block;
  color:var(--green);
  margin-bottom:4px
}
.clue small{
  color:var(--muted);
  line-height:1.5
}
.setting{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:13px 3px;
  border-bottom:1px solid var(--line)
}
.setting select{
  min-width:122px;
  height:40px;
  padding:0 8px;
  border:1px solid #9b907d;
  border-radius:6px;
  background:#fff9ed
}
.toggle{
  width:52px;
  height:30px;
  padding:3px;
  border:0;
  border-radius:18px;
  background:#aaa
}
.toggle i{
  display:block;
  width:24px;
  height:24px;
  border-radius:50%;
  background:#fff;
  transition:.2s
}
.toggle.on{background:var(--green)}
.toggle.on i{transform:translateX(22px)}
.notice{
  margin-top:12px;
  color:var(--muted);
  font-size:12px;
  text-align:center;
  line-height:1.6
}
.danger-btn{
  border-color:#9e4940!important;
  color:#8c3029!important
}
.toast{
  position:fixed;
  z-index:200;
  left:50%;
  bottom:calc(105px + var(--safe-bottom));
  transform:translate(-50%,20px);
  width:min(88vw,480px);
  padding:11px 14px;
  border-radius:8px;
  background:rgba(40,44,41,.95);
  color:#fff;
  text-align:center;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.22s
}
.toast.show{
  opacity:1;
  transform:translate(-50%,0)
}
.motion-dot{
  display:inline-block;
  width:7px;
  height:7px;
  margin-right:5px;
  border-radius:50%;
  background:#6e927a
}
@media(max-width:430px){
  .stats{gap:3px}
  .stat b{font-size:12px}
  .stat span{font-size:8px}
  .cards,.free-only{grid-template-columns:1fr}
  .story{min-height:140px}
  .scene h2{font-size:23px}
  .bottom-bar{gap:5px}
  .nav-btn{font-size:11px}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <div class="header-row">
      <div class="brand">
        <h1>问道浮生</h1>
        <p>相遇未必相守，选择自有归途</p>
      </div>
      <button class="icon-btn" id="topMenu" aria-label="菜单">☰</button>
    </div>
  </header>

  <section class="start" id="start">
    <h2>写下你自己的名字</h2>
    <p class="start-intro">
      你会遇见一个重要的人，但相遇并不保证相爱。<br>
      你们可能成为伴侣、朋友、合作伙伴，也可能从此别过。
    </p>

    <div class="creator">
      <div class="field">
        <label for="nameInput">名字或道号</label>
        <input id="nameInput" maxlength="8" placeholder="例如：云归">
      </div>

      <div class="field">
        <label for="playerGender">你的性别</label>
        <select id="playerGender">
          <option value="male">男性</option>
          <option value="female">女性</option>
          <option value="nonbinary">非二元／自定义</option>
        </select>
      </div>

      <div class="field">
        <label for="playerPronoun">希望他人如何称呼你</label>
        <select id="playerPronoun">
          <option value="ta">姓名／道号</option>
          <option value="he">他</option>
          <option value="she">她</option>
          <option value="they">其</option>
        </select>
      </div>

      <div class="field">
        <label for="romancePreference">情感倾向</label>
        <select id="romancePreference">
          <option value="any">性别不限</option>
          <option value="female">只考虑女性</option>
          <option value="male">只考虑男性</option>
          <option value="none">暂不考虑恋爱</option>
        </select>
        <small>这只影响恋爱可能，不影响友情、信任和合作关系。</small>
      </div>

      <div class="field">
        <label for="companionGender">初遇角色的性别</label>
        <select id="companionGender">
          <option value="random">随机</option>
          <option value="female">女性</option>
          <option value="male">男性</option>
          <option value="nonbinary">非二元／自定义</option>
        </select>
        <small>初遇角色只是潜在的重要人物，并非系统指定的伴侣。</small>
      </div>
    </div>

    <div class="start-actions">
      <button class="main-btn primary wide" id="begin">开始新的旅程</button>
      <button class="main-btn wide" id="continueGame" style="display:none">继续自动存档</button>
    </div>
  </section>

  <section class="game" id="game">
    <div class="sticky">
      <div class="progress-row">
        <b id="phaseText">第一回</b>
        <span>
          <i class="motion-dot" id="motionDot"></i>
          <span id="saveText">已自动存档</span>
        </span>
      </div>

      <div class="progress"><i id="progress"></i></div>

      <div class="stats">
        <div class="stat"><b id="coin">60</b><span>铜钱</span></div>
        <div class="stat" id="foodStat"><b id="food">10</b><span>食物</span></div>
        <div class="stat" id="healthStat"><b id="health">100</b><span>健康</span></div>
        <div class="stat"><b id="ap">—</b><span>行动力</span></div>
        <div class="stat"><b id="realm">凡身</b><span>境界</span></div>
        <div class="stat"><b id="members">1/0</b><span>人口/房位</span></div>
      </div>
    </div>

    <div class="content">
      <section class="guide" id="guide">
        <div class="guide-head">
          <b id="guideTitle">新手引导</b>
          <span id="guideStep"></span>
        </div>
        <div id="guideText"></div>
      </section>

      <article class="scene">
        <div class="label" id="label"></div>
        <h2 id="title"></h2>
        <div class="story" id="story"></div>
        <div class="goal">
          <b>当前目标：</b>
          <span id="goal"></span>
        </div>
      </article>

      <div class="cards">
        <div class="card">
          <b>人物关系</b>
          <span id="relationshipSummary">尚未遇见重要人物</span>
        </div>
        <div class="card">
          <b>装备与居所</b>
          <span id="assetSummary">无装备，租住小屋</span>
        </div>
      </div>

      <div class="cards free-only" id="freeInfo">
        <div class="card">
          <b>修行进度</b>
          <span id="cultivationSummary"></span>
        </div>
        <div class="card">
          <b>今日状态</b>
          <span id="dailySummary"></span>
        </div>
        <div class="card">
          <b>势力关系</b>
          <span id="factionSummary"></span>
        </div>
        <div class="card">
          <b>案件进度</b>
          <span id="caseSummary"></span>
        </div>
      </div>

      <div class="log">
        <b>浮生录</b>
        <div class="log-list" id="logs"></div>
      </div>
    </div>

    <nav class="bottom-bar">
      <button class="nav-btn" id="mapButton">
        地图
        <span class="badge" id="mapBadge">!</span>
      </button>

      <button class="nav-btn primary" id="actionButton">
        作出选择
        <span class="badge" id="actionBadge">!</span>
      </button>

      <button class="nav-btn" id="shopButton">
        市集
        <span class="badge" id="shopBadge">!</span>
      </button>

      <button class="nav-btn" id="journalButton">
        任务与人物
        <span class="badge" id="journalBadge">!</span>
      </button>
    </nav>
  </section>
</main>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <button class="close right" id="closeModal" aria-label="关闭">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SAVE_KEY = "wendao-fusheng-v6";
const LEGACY_V5_KEY = "wendao-fusheng-v5";

const $ = id => document.getElementById(id);

const weaponNames = ["无", "木剑", "青锋剑", "玄铁剑"];
const armorNames = ["无", "布甲", "皮甲", "玄铁甲"];
const methodNames = ["无", "吐纳诀", "守心诀", "两仪心法"];

const genderNames = {
  male:"男性",
  female:"女性",
  nonbinary:"非二元"
};

const professions = {
  apothecary:{
    name:"药师",
    place:"medicine",
    desc:"辨药、制药和采集收益更高。"
  },
  guard:{
    name:"护卫",
    place:"guard",
    desc:"巡逻、护送和危险行动更加稳定。"
  },
  scholar:{
    name:"书生",
    place:"academy",

      chen:{trust:0,closeness:0},
      yun:{trust:0,closeness:0}
    },
    clues:[],
    caseResolved:false,
    caseResult:"",
    suspicion:0,
    logs:[],
    tutorial:{
      active:true,
      step:0,
      mapOpened:false,
      movedToWork:false,
      worked:false,
      returnedHome:false,
      ate:false,
      talked:false,
      clue:false
    },
    seen:{
      journal:false,
      shop:false,

    },

    }

}

let state = freshState();
let toastTimer = 0;
let modalLocked = false;

function esc(value){
  return String(value).replace(/[&<>"']/g,char=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function randomItem(list){
  return list[Math.floor(Math.random()*list.length)];
}

function makeCompanion(genderChoice){
  let gender = genderChoice;

  if(gender === "random"){
    gender = randomItem(["female","male","nonbinary"]);
  }

  const names = {
    female:["沈禾","陆青梧","顾微澜","宁秋"],
    male:["沈川","陆长青","顾闻舟","宁砚"],
    nonbinary:["沈青","陆归尘","顾照","宁无墨"]
  };

  const pronouns = {
    female:"她",
    male:"他",
    nonbinary:"其"
  };

  return {
    name:randomItem(names[gender]),
    gender,
    pronoun:pronouns[gender],
    trait:randomItem(["谨慎务实","温和独立","重视承诺","向往自由"]),
    present:true,
    relationType:"相识",
    trust:0,
    closeness:0,
    affection:0,
    conflict:0
  };
}

function migrateV5(old){
  const next = freshState();

  next.player.name = old.name || "无名客";
  next.coin = old.coin ?? 60;
  next.food = old.food ?? 10;
  next.health = 85;
  next.qi = old.qi ?? 0;
  next.house = !!old.house;
  next.weapon = old.weapon ?? 0;
  next.armor = old.armor ?? 0;
  next.method = old.method ?? 0;
  next.logs = Array.isArray(old.logs) ? old.logs.slice(0,40) : [];

  next.companion = makeCompanion("female");
  next.companion.name = "沈禾";
  next.companion.trust = Math.max(5,old.bond || 0);
  next.companion.closeness = Math.max(0,Math.floor((old.bond || 0)*.7));

  if(old.mode === "prologue"){
    next.mode = "prologue";
    next.turn = Math.min(9,old.turn || 0);
  }else{
    next.mode = "free";
    next.profession = old.profession || "apothecary";
    next.day = old.day || 1;
    next.ap = old.ap ?? 3;
    next.location = old.location || "home";
    next.route = old.route || "companion";
    next.companion.relationType = old.route === "family" ? "伴侣" : "长期伙伴";
    next.members = old.members || 2;
    next.tutorial.step = 0;
  }

  next.logs.unshift("系统：旧版存档已迁移。人物关系与健康使用安全默认值。");
  return next;
}

function mergeState(data){
  const base = freshState();

  return {
    ...base,
    ...data,
    player:{...base.player,...(data.player||{})},
    companion:{...base.companion,...(data.companion||{})},
    factions:{...base.factions,...(data.factions||{})},
    npcRelations:{...base.npcRelations,...(data.npcRelations||{})},
    tutorial:{...base.tutorial,...(data.tutorial||{})},
    seen:{
      ...base.seen,
      ...(data.seen||{}),
      places:{...base.seen.places,...((data.seen||{}).places||{})},
      npcs:{...base.seen.npcs,...((data.seen||{}).npcs||{})},
      clues:Array.isArray((data.seen||{}).clues)?data.seen.clues:[]
    },
    settings:{...base.settings,...(data.settings||{})},
    clues:Array.isArray(data.clues)?data.clues:[],
    logs:Array.isArray(data.logs)?data.logs:[]
  };
}

function loadAuto(){
  const raw = localStorage.getItem(SAVE_KEY);

  if(raw){
    try{
      return mergeState(JSON.parse(raw));
    }catch(error){
      localStorage.removeItem(SAVE_KEY);
    }
  }

  const oldRaw = localStorage.getItem(LEGACY_V5_KEY);

  if(oldRaw){
    try{
      return migrateV5(JSON.parse(oldRaw));
    }catch(error){
      return null;
    }
  }

  return null;
}

function clampState(){
  state.coin=Math.max(0,Math.floor(Number(state.coin)||0));
  state.food=Math.max(0,Math.floor(Number(state.food)||0));
  state.health=Math.max(0,Math.min(100,Math.floor(Number(state.health)||0)));
  state.qi=Math.max(0,Math.floor(Number(state.qi)||0));
  state.ap=Math.max(0,Math.min(3,Math.floor(Number(state.ap)||0)));

  ["trust","closeness","affection"].forEach(key=>{
    state.companion[key]=Math.max(-20,Math.min(100,state.companion[key]||0));
  });

  state.companion.conflict=Math.max(0,Math.min(100,state.companion.conflict||0));
}

function save(){
  clampState();
  localStorage.setItem(SAVE_KEY,JSON.stringify(state));
  $("saveText").textContent="已自动存档";
}

function log(text){
  state.logs.unshift(text);
  state.logs=state.logs.slice(0,70);
}

function toast(text){
  clearTimeout(toastTimer);
  $("toast").textContent=text;
  $("toast").classList.add("show");
  toastTimer=setTimeout(()=>$("toast").classList.remove("show"),2200);
}

function openModal(html,locked=false){
  modalLocked=locked;
  $("modalBody").innerHTML=html;
  $("closeModal").className=`close ${state.settings.closeSide}`;
  $("closeModal").style.display=locked?"none":"";
  $("overlay").classList.add("open");
}

function closeModal(){
  if(modalLocked)return;
  $("overlay").classList.remove("open");
  $("closeModal").style.display="";
}

function forceCloseModal(){
  modalLocked=false;
  $("overlay").classList.remove("open");
  $("closeModal").style.display="";
}

function applyEffects(effects={}){
  const direct=["coin","food","health","qi"];

  direct.forEach(key=>{
    state[key]+=effects[key]||0;
  });

  ["trust","closeness","affection","conflict"].forEach(key=>{
    state.companion[key]+=effects[key]||0;
  });

  if(effects.medicine)state.factions.medicine+=effects.medicine;
  if(effects.guard)state.factions.guard+=effects.guard;
  if(effects.academy)state.factions.academy+=effects.academy;
  if(effects.xp)state.profXP+=effects.xp;

  clampState();
}

function orientationCompatible(){
  const pref=state.player.preference;

  if(pref==="none")return false;
  if(pref==="any")return true;
  return pref===state.companion.gender;
}

function currentDate(){
  const year=1+Math.floor((state.day-1)/360);
  const month=1+Math.floor(((state.day-1)%360)/30);
  const day=1+((state.day-1)%30);

  return `浮生${year}年 ${month}月${day}日`;
}

function weekday(){
  return ((state.day-1)%7)+1;
}

function weekdayName(){
  return ["一","二","三","四","五","六","日"][weekday()-1];
}

function periodName(){
  if(state.ap===3)return "清晨";
  if(state.ap===2)return "午后";
  if(state.ap===1)return "黄昏";
  return "夜深";
}

function realmInfo(){
  const realms=[
    {name:"凡身",min:0,next:30},
    {name:"感气",min:30,next:80},
    {name:"引气",min:80,next:160},
    {name:"凝元",min:160,next:280},
    {name:"筑基",min:280,next:null}
  ];

  let current=realms[0];

  realms.forEach(realm=>{
    if(state.qi>=realm.min)current=realm;
  });

  return current;
}

function realmProgressText(){
  const realm=realmInfo();

  if(realm.next===null){
    return `${realm.name}｜修为 ${state.qi}｜当前试玩版最高境界`;
  }

  return `${realm.name}｜修为 ${state.qi}/${realm.next}｜距离突破 ${realm.next-state.qi}`;
}

function capacity(){
  return state.house?6:0;
}

function healthDescription(){
  if(state.health>=85)return "精力充沛";
  if(state.health>=60)return "状态尚可";
  if(state.health>=35)return "身体疲惫";
  if(state.health>=15)return "虚弱不堪";
  return "病危";
}

function relationLabel(){
  return state.companion.relationType||"相识";
}

function relationshipSummary(){
  const c=state.companion;

  if(!c.present){
    return `${c.name}已离开青石城｜最终关系：${c.relationType}`;
  }

  return `${c.name}（${genderNames[c.gender]}）｜${relationLabel()}｜信任 ${c.trust}｜亲近 ${c.closeness}｜好感 ${c.affection}｜分歧 ${c.conflict}`;
}

function professionRank(){
  if(state.profXP>=75)return "名士";
  if(state.profXP>=40)return "行家";
  if(state.profXP>=18)return "熟手";
  return "初习";
}

function professionText(){
  if(!state.profession)return "尚未选择职业";
  return `${professionRank()}${professions[state.profession].name}｜经验 ${state.profXP}`;
}

function currentNPCPlace(id){
  const evening=state.ap<=1;
  const w=weekday();

  if(id==="companion"){
    if(!state.companion.present)return null;
    if(evening)return "home";
    if(w<=5)return "medicine";
    return w===6?"market":"outskirts";
  }

  if(id==="xu"){
    return w<=5?(state.ap===3?"guard":"palace"):"market";
  }

  if(id==="lin"){
    return w<=5?"academy":w===6?"market":"home";
  }

  if(id==="chen"){
    return state.ap===1?"medicine":"market";
  }

  if(id==="yun"){
    return state.day%2===0&&state.ap>=2?"palace":"home";
  }

  return null;
}

function npcAvailable(id){
  if(id==="xu")return state.day>=2;
  if(id==="lin")return state.day>=3;
  if(id==="chen")return state.day>=2;
  if(id==="yun")return state.day>=4||state.clues.includes("cup");
  return id==="companion"&&state.companion.present;
}

function npcInfo(id){
  if(id==="companion"){
    return {
      name:state.companion.name,
      desc:`与你在雨巷相遇的${state.companion.trait}之人。`
    };
  }

  return baseNPCs[id];
}

function npcsHere(){
  return ["companion","xu","lin","chen","yun"].filter(id=>
    npcAvailable(id)&&currentNPCPlace(id)===state.location
  );
}

function unseenNPCsHere(){
  return npcsHere().filter(id=>!state.seen.npcs[id]);
}

function placeHasNotice(placeId){
  if(state.mode!=="free")return false;

  if(unseenNPCsHere().length&&placeId===state.location)return true;

  const ids=["companion","xu","lin","chen","yun"];

  return ids.some(id=>
    npcAvailable(id)&&
    currentNPCPlace(id)===placeId&&
    !state.seen.npcs[id]
  );
}

function prologueChance(choice){
  let chance=choice.chance;

  if(choice.title.includes("亲自煎药")){
    chance+=Math.floor(state.qi/3);
    chance+=Math.floor((state.health-70)/5);
  }

  if(choice.title.includes("共同寻找")){
    chance+=Math.floor(state.companion.trust/4);
  }

  if(choice.title.includes("引开盗匪")){
    chance+=Math.floor((state.health-70)/4);
    chance+=Math.floor(state.qi/4);
  }

  if(choice.romantic&&!orientationCompatible()){
    chance=8;
  }

  if(choice.commitment){
    chance+=Math.floor(state.companion.trust/5);
    chance+=Math.floor(state.companion.closeness/5);
    chance+=Math.floor(state.companion.affection/4);
    chance-=Math.floor(state.companion.conflict/3);
  }

  return Math.max(5,Math.min(95,Math.round(chance)));
}

function tutorialInfo(){
  const t=state.tutorial;

  if(!t.active||!state.settings.guidance){
    return null;
  }

  const steps=[
    {
      title:"第一步：查看地图",
      text:"点击底部“地图”。红点表示新人物、首次事件或尚未查看的地点。"
    },
    {
      title:"第二步：前往谋生地点",
      text:`前往${state.profession?places[professions[state.profession].place].name:"职业地点"}，完成一次工作。移动不消耗行动力。`
    },
    {
      title:"第三步：返回住处",
      text:"工作后打开地图返回住处。你需要在结束一天前安排晚饭。"
    },
    {
      title:"第四步：吃饭并休息",
      text:"在住处选择“安排晚饭”。不吃饭会损失健康，连续挨饿会减少次日行动力。"
    },
    {
      title:"第五步：认识城中人物",
      text:"新的一天开始后，寻找带红点的地点，并与一名特殊人物交谈。"
    },
    {
      title:"第六步：取得第一条线索",
      text:"前往药行核对账册，或在其他地点调查世子之死。"
    }
  ];

  if(t.step>=steps.length)return null;

  return {
    ...steps[t.step],
    index:t.step+1,
    total:steps.length
  };
}

function advanceTutorial(action){
  const t=state.tutorial;

  if(!t.active)return;

  if(t.step===0&&action==="openMap"){
    t.mapOpened=true;
    t.step=1;
    toast("引导完成：你已经学会查看地图");
  }else if(t.step===1&&action==="work"){
    t.worked=true;
    t.step=2;
    toast("引导完成：第一次工作");
  }else if(t.step===2&&action==="returnHome"){
    t.returnedHome=true;
    t.step=3;
    toast("下一步：在住处安排晚饭");
  }else if(t.step===3&&action==="eat"){
    t.ate=true;
    t.step=4;
  }else if(t.step===4&&action==="talk"){
    t.talked=true;
    t.step=5;
    toast("引导完成：第一次与特殊人物交谈");
  }else if(t.step===5&&action==="clue"){
    t.clue=true;
    t.step=6;
    t.active=false;
    log("新手引导完成：你已经掌握地图、工作、吃饭、人物日程和调查。");
    toast("新手引导已经完成");
  }

  save();
}

function suggestedGoal(){
  if(state.mode!=="free")return "";

  const guide=tutorialInfo();
  if(guide)return guide.text;

  if(state.health<35){
    return "你的健康很低。建议购买食物、正常吃饭，并在住处休养。";
  }

  if(state.food<state.members*2){
    return `食物只够维持约 ${Math.floor(state.food/Math.max(1,state.members))} 天，建议前往市集或城外补充。`;
  }

  if(!state.caseResolved&&state.clues.length<2){
    return "世子之死仍有疑点。药行账册是较安全的调查起点。";
  }

  if(!state.house&&state.coin>=90){
    return "你已经接近永久房屋所需的 120 枚铜钱。";
  }

  if(!state.caseResolved&&state.clues.length>=6){
    return "证据已经足够。可以回住处整理并提交世子案证据。";
  }

  return "你可以谋生、修炼、经营关系、购买房屋，或继续调查世子案。";
}

function updateBadges(){
  const enabled=state.settings.redDots;

  const mapNotice=enabled&&state.mode==="free"&&(
    state.tutorial.step===0||
    Object.keys(places).some(placeHasNotice)
  );

  const actionNotice=enabled&&state.mode==="free"&&(
    state.location==="home"&&!state.ateToday&&state.ap===0
  );

  const shopNotice=enabled&&state.mode==="free"&&!state.seen.shop;

  const newClues=state.clues.filter(id=>!state.seen.clues.includes(id));
  const journalNotice=enabled&&(
    !state.seen.journal||
    newClues.length>0||
    state.tutorial.active
  );

  $("mapBadge").classList.toggle("show",mapNotice);
  $("actionBadge").classList.toggle("show",actionNotice);
  $("shopBadge").classList.toggle("show",shopNotice);
  $("journalBadge").classList.toggle("show",journalNotice);

  if(newClues.length>0){
    $("journalBadge").textContent=String(newClues.length);
  }else{
    $("journalBadge").textContent="!";
  }
}

function render(){
  clampState();

  const free=state.mode==="free";
  $("freeInfo").classList.toggle("active",free);
  $("mapButton").disabled=!free;

  const guide=tutorialInfo();
  $("guide").classList.toggle("active",!!guide);

  if(guide){
    $("guideTitle").textContent=guide.title;
    $("guideStep").textContent=`${guide.index}/${guide.total}`;
    $("guideText").textContent=guide.text;
  }

  if(state.mode==="prologue"){
    const event=prologueEvents[state.turn];

    $("label").textContent=event.label;
    $("title").textContent=event.title;
    $("story").textContent=event.story(state.companion);
    $("goal").textContent=event.goal;
    $("phaseText").textContent=`第 ${state.turn+1} / 10 回合`;
    $("progress").style.width=`${(state.turn+1)*10}%`;
    $("actionButton").firstChild.textContent="作出选择";
    $("ap").textContent="—";
  }else if(state.mode==="profession"){
    $("label").textContent="十回之后 · 新的道路";
    $("title").textContent="选择谋生之道";
    $("story").textContent="青石城不会因为一段关系的确定或结束而停止运转。\n\n你需要选择初步职业。职业提供加成，但不会禁止其他行动。";
    $("goal").textContent="选择药师、护卫或书生，进入自由生活阶段。";
    $("phaseText").textContent="选择职业";
    $("progress").style.width="100%";
    $("actionButton").firstChild.textContent="选择职业";
    $("ap").textContent="—";
  }else{
    const here=npcsHere();

    $("label").textContent=`${currentDate()} · 星期${weekdayName()} · ${periodName()}`;
    $("title").textContent=places[state.location].name;
    $("story").textContent=
      `${places[state.location].desc}\n\n`+
      `当前健康：${state.health}/100（${healthDescription()}）。`+
      `${state.ateToday?"你今天已经安排过晚饭。":"你今天还没有吃晚饭。"}\n\n`+
      (here.length
        ? `此刻在这里的人：${here.map(id=>npcInfo(id).name).join("、")}。`
        :"此刻没有熟识的人在这里。");

    $("goal").textContent=suggestedGoal();
    $("phaseText").textContent=`${currentDate()} · ${periodName()}`;
    $("progress").style.width=`${state.ap/3*100}%`;
    $("actionButton").firstChild.textContent=state.ap>0?"当前地点行动":"安排晚饭";
    $("ap").textContent=`${state.ap}/3`;

    $("cultivationSummary").textContent=realmProgressText();
    $("dailySummary").textContent=
      `${professionText()}｜${state.ateToday?"已用餐":"未用餐"}｜健康：${healthDescription()}`;
    $("factionSummary").textContent=
      `药行 ${state.factions.medicine}｜巡检司 ${state.factions.guard}｜书院 ${state.factions.academy}`;
    $("caseSummary").textContent=state.caseResolved
      ? `已结案：${state.caseResult}`
      : `线索 ${state.clues.length}/8｜警觉 ${state.suspicion}`;
  }

  $("coin").textContent=state.coin;
  $("food").textContent=state.food;
  $("health").textContent=`${state.health}`;
  $("realm").textContent=realmInfo().name;
  $("members").textContent=`${state.members}/${capacity()}`;
  $("relationshipSummary").textContent=relationshipSummary();
  $("assetSummary").textContent=
    `${weaponNames[state.weapon]}、${armorNames[state.armor]}、${methodNames[state.method]}｜`+
    `${state.house?"永久房屋，最多六人":"租住小屋"}`;

  $("foodStat").classList.toggle("warning",state.food<state.members*2);
  $("healthStat").classList.toggle("warning",state.health<60);
  $("healthStat").classList.toggle("danger",state.health<30);

  $("logs").innerHTML=state.logs.length
    ?state.logs.slice(0,18).map(item=>`<div>${esc(item)}</div>`).join("")
    :"旅程刚刚开始。";

  updateBadges();
  save();
}

function openPrologueChoices(){
  const event=prologueEvents[state.turn];

  let html=`
    <h2>${event.title}</h2>
    <p class="modal-desc">
      同一个选择不一定每次得到相同结果。成功率会受到健康、修为和此前关系影响。
    </p>
    <div class="choice-list">
  `;

  event.choices.forEach((choice,index)=>{
    const chance=prologueChance(choice);
    const impossibleRomance=choice.romantic&&!orientationCompatible();

    html+=`
      <button class="choice" data-choice="${index}">
        <strong>${choice.title}</strong>
        <small>${choice.desc}</small>
        <em class="${chance<45?"risk":""}">
          预计顺利概率：${chance}%
          ${impossibleRomance?"｜当前情感倾向不支持恋爱发展":""}
        </em>
      </button>
    `;
  });

  html+="</div>";
  openModal(html);

  $("modalBody").querySelectorAll("[data-choice]").forEach(button=>{
    button.onclick=()=>resolvePrologueChoice(
      event.choices[Number(button.dataset.choice)]
    );
  });
}

function resolvePrologueChoice(choice){
  const chance=prologueChance(choice);
  const roll=Math.floor(Math.random()*100)+1;
  const success=roll<=chance;
  const effects=success?choice.success:choice.fail;

  applyEffects(effects);

  if(choice.commitment)state.lastCommitment=true;
  if(choice.partnership)state.lastPartnership=true;
  if(choice.farewell)state.lastFarewell=true;

  const resultText=success?choice.successText:choice.failText;

  log(`第${state.turn+1}回合：${choice.title}。${success?"事情较为顺利":"结果未如预期"}。`);

  state.turn++;

  openModal(`
    <h2>${success?"事情较为顺利":"结果未如预期"}</h2>
    <p class="modal-desc">判定 ${roll}｜需要不高于 ${chance}</p>
    <div class="result-box ${success?"success":"fail"}">
      ${esc(resultText)}
    </div>
    <div class="notice">
      信任 ${state.companion.trust}｜亲近 ${state.companion.closeness}｜
      好感 ${state.companion.affection}｜分歧 ${state.companion.conflict}
    </div>
    <button class="main-btn primary wide" id="continueStory">
      ${state.turn>=10?"查看十回合结果":"进入下一回合"}
    </button>
  `,true);

  $("continueStory").onclick=()=>{
    forceCloseModal();

    if(state.turn>=10){
      determineRelationship();
    }else{
      render();
    }
  };

  save();
}

function determineRelationship(){
  const c=state.companion;
  const compatible=orientationCompatible();

  let type="普通相识";
  let present=true;
  let reason="你们偶尔仍会在城中见面，却各自拥有自己的生活。";

  const romanceScore=
    c.trust+
    c.closeness+
    c.affection*1.2-
    c.conflict*1.5;

  const partnerPossible=
    compatible&&
    state.lastCommitment&&
    c.trust>=28&&
    c.closeness>=24&&
    c.affection>=15&&
    c.conflict<28&&
    romanceScore>=80;

  if(state.lastFarewell){
    type="故人";
    present=false;
    reason="你们认真告别。离开并不意味着此前的相遇毫无意义。";
  }else if(partnerPossible){
    type="伴侣";
    reason="此前的信任、亲近与感情让你们愿意尝试共同生活。";
  }else if(c.conflict>=32||c.trust<0){
    type="关系破裂";
    present=false;
    reason="长期积累的分歧超过了彼此愿意继续修补的程度。对方离开了青石城。";
  }else if(c.trust>=32&&c.closeness>=25){
    type=state.lastPartnership?"长期伙伴":"亲密朋友";
    reason="你们没有成为伴侣，却仍是彼此生活中重要的人。";
  }else if(c.trust>=15){
    type="普通朋友";
    reason="你们保留联系，但不会把人生交到同一条道路上。";
  }

  c.relationType=type;
  c.present=present;

  if(type==="伴侣"||type==="长期伙伴"||type==="亲密朋友"){
    state.members=2;
  }else{
    state.members=1;
  }

  state.mode="profession";

  openModal(`
    <h2>十回合之后 · ${type}</h2>
    <p class="modal-desc">
      相遇并不保证相爱，最后一次选择也不能覆盖此前全部经历。
    </p>
    <div class="result-box">
      <b>${esc(c.name)}与你的关系：${type}</b><br>
      ${esc(reason)}
    </div>
    <div class="relationship">
      <div class="relationship-head">
        <b>${esc(c.name)}</b>
        <span>${genderNames[c.gender]}｜${esc(c.trait)}</span>
      </div>
      ${relationMeter("信任",c.trust)}
      ${relationMeter("亲近",c.closeness)}
      ${relationMeter("好感",c.affection)}
      ${relationMeter("分歧",c.conflict,true)}
    </div>
    <button class="main-btn primary wide" id="chooseProfession">继续生活</button>
  `,true);

  $("chooseProfession").onclick=()=>{
    forceCloseModal();
    render();
    openProfessionChoice();
  };

  save();
}

function relationMeter(name,value,negative=false){
  const shown=Math.max(0,Math.min(100,value));

  return `
    <div class="meter-row">
      <span>${name}</span>
      <div class="meter"><i style="width:${shown}%;background:${negative?"#843a31":"#53685b"}"></i></div>
      <b>${value}</b>
    </div>
  `;
}

  state.ap=3;
  state.location="home";

function openMap(){
  if(state.mode!=="free")return;

  state.seen.places[state.location]=true;
  advanceTutorial("openMap");

  let html=`
    <h2>青石城舆图</h2>
    <p class="modal-desc">
      移动不消耗行动力。红点表示新人物或尚未查看的事件。
    </p>
    <div class="map-grid">
  `;

  Object.entries(places).forEach(([id,place])=>{
    const locked=id==="palace"&&
      state.factions.guard<4&&
      !state.clues.includes("route");

    html+=`
      <button class="map-place ${state.location===id?"active":""}"
        data-place="${id}" ${locked?"disabled":""}>
        ${placeHasNotice(id)&&state.settings.redDots?'<i class="map-dot"></i>':""}
        <b>${place.name}</b>
        <small>${locked
          ?"需要巡检司关系达到 4，或先取得巡夜路线。"

      </button>

  });

  html+="</div>";
  openModal(html);

  $("modalBody").querySelectorAll("[data-place]").forEach(button=>{
    button.onclick=()=>moveTo(button.dataset.place);
  });

  render();
}

function moveTo(place){
  const old=state.location;
  state.location=place;
  state.seen.places[place]=true;

  npcsHere().forEach(id=>{
    if(!state.seen.npcs[id]){
      toast(`${npcInfo(id).name}出现在${places[place].name}`);
    }
  });

  if(place===professions[state.profession].place){
    state.tutorial.movedToWork=true;
  }

  if(place==="home"&&old!=="home"&&state.tutorial.step===2){
    advanceTutorial("returnHome");
  }

  log(`移动：来到${places[place].name}。`);
  forceCloseModal();
  render();
}

function actionEfficiency(){
  if(state.health>=60)return 1;
  if(state.health>=30)return .75;
  return .5;
}

function spendAction(name,effects={},detail="",tutorialAction=""){
  if(state.ap<1){
    toast("今日行动力不足");
    return false;
  }

  state.ap--;
  applyEffects(effects);
  log(`${currentDate()}：${name}${detail?`，${detail}`:""}。`);

  if(tutorialAction)advanceTutorial(tutorialAction);

  forceCloseModal();
  render();
  return true;
}

function addClue(id){
  if(state.clues.includes(id))return false;

  state.clues.push(id);
  log(`调查：取得线索“${clueData[id].name}”。`);
  toast(`获得新线索：${clueData[id].name}`);
  advanceTutorial("clue");
  return true;
}

function runAction(id){
  const efficiency=actionEfficiency();

  if(id==="cultivate"){
    const base=4+state.method*2+(state.profession==="scholar"?3:0);
    const gain=Math.max(1,Math.floor(base*efficiency));

    spendAction(
      "静心修炼",
      {qi:gain,xp:state.profession==="scholar"?3:1},
      `修为增加 ${gain}`
    );
  }

  if(id==="recover"){
    if(state.food<1){
      toast("至少需要一份食物");
      return;
    }

    spendAction(
      "在住处休养",
      {food:-1,health:14},
      "健康有所恢复"
    );
  }

  if(id==="companionTime"){
    const c=state.companion;
    let effects={trust:2,closeness:3};

    if(c.relationType==="伴侣"&&orientationCompatible()){
      effects.affection=3;
    }

    if(c.conflict>20){
      effects.conflict=-2;
    }

    spendAction(
      `与${c.name}相处`,
      effects,
      c.relationType==="伴侣"
        ?"你们交换了这一天的见闻"
        :"你们在各自边界内保持联系"
    );
  }

  if(id==="marketWork"){
    const coin=Math.floor((state.profession==="guard"?12:9)*efficiency);

    spendAction(
      "替商户搬运货物",
      {coin,health:-2,xp:2},
      `获得 ${coin} 枚铜钱`,
      "work"
    );
  }

  if(id==="medicineWork"){
    const coin=Math.floor((state.profession==="apothecary"?16:11)*efficiency);

    spendAction(
      "在回春药行工作",
      {coin,health:-1,medicine:2,xp:3},
      `获得 ${coin} 枚铜钱`,
      "work"
    );
  }

  if(id==="guardWork"){
    const coin=Math.floor((state.profession==="guard"?16:10)*efficiency);

    spendAction(
      "协助巡检司巡逻",
      {coin,health:-3,guard:2,xp:3},
      `获得 ${coin} 枚铜钱`,
      "work"
    );
  }

  if(id==="academyWork"){
    const qi=Math.floor((state.profession==="scholar"?8:5)*efficiency);

    spendAction(
      "在白鹿书院研读旧卷",
      {qi,health:-1,academy:2,xp:3},
      `修为增加 ${qi}`,
      "work"
    );
  }

  if(id==="palaceWork"){
    spendAction(
      "协助整理王府杂物",
      {coin:8,guard:1,health:-1},
      "你获得了在王府中停留的机会",
      "work"
    );
  }

  if(id==="gather"){
    const food=Math.floor((state.profession==="apothecary"?10:7)*efficiency);

    spendAction(
      "在山野采集",
      {food,qi:2,health:-3,xp:2},
      `获得 ${food} 份食物`
    );
  }

  if(id==="hunt"){
    if(state.weapon<=0){
      toast("需要先购买武器");
      return;
    }

    const food=Math.floor((10+state.weapon*4)*efficiency);

    spendAction(
      "持武器狩猎",
      {food,qi:2,health:-5},
      `获得 ${food} 份食物`
    );
  }

  if(id==="ledgerClue"){
    if(spendAction("核对药材账册",{medicine:1},"发现被撕去账页留下的墨痕")){
      addClue("ledger");
      render();
    }
  }

  if(id==="sealClue"){
    if(spendAction("检查北境货印",{},"发现官府编号经过伪造")){
      addClue("seal");
      render();
    }
  }

  if(id==="routeClue"){
    if(state.profession!=="guard"&&state.factions.guard<3){
      toast("需要护卫职业或至少三点巡检司关系");
      return;
    }

    if(spendAction("查阅巡夜路线",{guard:1},"发现案发当夜有人临时调走守卫")){
      addClue("route");
      render();
    }
  }

  if(id==="toxinClue"){
    if(state.profession!=="scholar"&&state.factions.academy<3){
      toast("需要书生职业或至少三点书院关系");
      return;
    }

    if(spendAction("查阅北境毒理",{academy:1,qi:2},"确认寒髓散会伪装成急病")){
      addClue("toxin");
      render();
    }
  }

  if(id==="cupClue"){
    if(!state.clues.includes("route")&&state.factions.guard<5){
      toast("需要巡夜路线或至少五点巡检司关系");
      return;
    }

    if(spendAction("检查世子遗留酒杯",{guard:1},"杯底残留银蓝色沉淀")){
      addClue("cup");
      render();
    }
  }

  if(id==="explore"){
    if(
      state.clues.includes("seal")&&
      !state.clues.includes("smuggler")
    ){
      if(spendAction("探索废弃驿道",{coin:5,guard:2,health:-4},"截住了一名走私者")){
        addClue("smuggler");
        render();
      }
    }else{
      const food=3+Math.floor(Math.random()*6);

      spendAction(
        "探索废弃驿道",
        {food,qi:2,health:-4},
        `获得 ${food} 份食物`
      );
    }
  }

  if(id==="social"){
    openSocial();
  }

  if(id==="dinner"){
    if(state.ateToday){
      openSleepConfirm();
    }else{
      openDinner();
    }
  }

  if(id==="resolveCase"){
    openCaseResolution();
  }
}

  if(!ids.length){
    toast("这里没有可以交谈的熟人");
    return;

  let html=`

    <p class="modal-desc">交谈消耗一点行动力，并可能解锁新线索。</p>
    <div class="choice-list">
  `;

  ids.forEach(id=>{
    const info=npcInfo(id);

    html+=`

        ${!state.seen.npcs[id]&&state.settings.redDots?'<i class="map-dot"></i>':""}
        <strong>${info.name}</strong>
        <small>${info.desc}</small>
      </button>
    `;
  });

  html+="</div>";
  openModal(html);

  $("modalBody").querySelectorAll("[data-npc]").forEach(button=>{

  });

function talkToNPC(id){
  if(state.ap<1){
    toast("行动力不足");
    return;
  }

  state.seen.npcs[id]=true;
  state.ap--;

  let text="你们交换了几句近况。";

  if(id==="companion"){
    applyEffects({trust:2,closeness:3});

    if(
      state.clues.includes("toxin")&&
      !state.clues.includes("herb")
    ){
      addClue("herb");
      text=`${state.companion.name}辨认出一种北境配药手法。`;
    }else{
      text=`${state.companion.name}向你说起药行近日的见闻。`;
    }
  }

  if(id==="xu"){
    state.npcRelations.xu.trust+=2;
    state.factions.guard+=2;
    text="徐砚谈起王府案发当夜混乱的换岗命令。";

    if(state.factions.guard>=5&&!state.clues.includes("route")){
      addClue("route");
    }
  }

  if(id==="lin"){

function eatMeal(type){
  const normalNeed=Math.max(1,state.members);
  const frugalNeed=Math.max(1,Math.ceil(state.members/2));
  let text="";

  if(type==="normal"){
    state.food-=normalNeed;
    state.health+=4;
    state.hungerStreak=0;
    text=`正常用餐，消耗 ${normalNeed} 份食物。`;
  }

  if(type==="rich"){
    state.food-=normalNeed*2;
    state.health+=9;
    state.hungerStreak=0;
    state.companion.trust+=state.companion.present?1:0;
    state.companion.closeness+=state.companion.present?2:0;
    text=`丰盛用餐，消耗 ${normalNeed*2} 份食物。`;
  }

  if(type==="frugal"){
    state.food-=frugalNeed;
    state.health-=5;
    state.hungerStreak+=1;
    text=`节省口粮，消耗 ${frugalNeed} 份食物。`;
  }

  if(type==="skip"){
    state.health-=15;
    state.hungerStreak+=1;
    state.companion.conflict+=state.companion.present&&state.members>1?2:0;
    text="没有吃饭，健康明显下降。";
  }

  state.ateToday=true;
  log(`${currentDate()}：${text}`);
  advanceTutorial("eat");
  forceCloseModal();
  render();

  openSleepConfirm();
}

function dailyRandomEvent(){
  if(Math.random()>.4){
    return "今日没有发生额外事件。";
  }

  const events=[
    {
      text:"邻里送来一篮新鲜蔬果。",
      effects:{food:5}
    },
    {
      text:"连日阴雨使部分存粮受潮。",
      effects:{food:-3}
    },
    {
      text:"你在睡梦中捕捉到一丝灵息。",
      effects:{qi:3}
    },
    {
      text:"药行临时结算了一笔零散工钱。",
      effects:{coin:6}
    },
    {
      text:"夜里风寒加重，你的身体有些不适。",
      effects:{health:-5}
    }
  ];

  if(state.companion.present){
    events.push({
      text:`${state.companion.name}带回了一包药材，并询问你的近况。`,
      effects:{health:3,trust:1}
    });
  }

  const event=randomItem(events);
  applyEffects(event.effects);
  return event.text;
}

function endDay(){
  if(!state.ateToday){
    state.health-=15;
    state.hungerStreak+=1;
    log(`${currentDate()}：你没有安排晚饭，空腹度过了这一夜。`);
  }

  let rentText="";

  if(!state.house&&state.day%5===0){
    if(state.coin>=6){
      state.coin-=6;
      rentText="支付了 6 枚铜钱租金。";
    }else{
      state.coin=0;
      state.health-=3;
      state.companion.conflict+=state.companion.present?2:0;
      rentText="无力足额支付租金，居住压力增加。";
    }
  }

  const eventText=dailyRandomEvent();

  if(state.health>=70&&state.hungerStreak===0){
    state.health+=3;
  }

  let nextAP=3;

  if(state.health<60)nextAP=2;
  if(state.health<30)nextAP=1;
  if(state.hungerStreak>=2)nextAP=Math.max(1,nextAP-1);

  if(state.health<=0){
    state.health=18;
    state.coin=Math.max(0,state.coin-18);
    nextAP=1;
    log("健康降至危险水平，你被送往医馆并支付了诊金。");
  }

  state.day++;
  state.ap=nextAP;
  state.location="home";
  state.ateToday=false;

  forceCloseModal();
  render();

  openModal(`
    <h2>一日结算</h2>
    <p class="modal-desc">${currentDate()} · 星期${weekdayName()}</p>
    <div class="result-box">
      ${rentText?`• ${esc(rentText)}<br>`:""}
      • ${esc(eventText)}<br>
      • 明日行动力：${nextAP}/3。<br>
      • 当前健康：${state.health}/100（${healthDescription()}）。
    </div>
    <button class="main-btn primary wide" id="newDay">开始今日</button>
  `);

  $("newDay").onclick=closeModal;
}

function resolveCase(target){
  if(state.ap<1){
    toast("行动力不足");
    return;
  }

  state.ap--;

  if(target==="gu"){
    const relations=
      state.factions.medicine+
      state.factions.guard+
      state.factions.academy;

    state.caseResolved=true;

    if(state.clues.length>=8&&relations>=22){
      state.caseResult="铁证如山";
      state.coin+=100;
      state.health+=8;
      state.qi+=10;
    }else{
      state.caseResult="险中求真";
      state.coin+=60;
      state.qi+=6;
    }

    log(`世子案结案：${state.caseResult}。顾惟安借北境商队运毒，并调走王府守卫。`);

    forceCloseModal();
    render();

    openModal(`
      <h2>${state.caseResult}</h2>
      <div class="result-box success">
        世子并非死于急病。顾惟安利用内府身份调走守卫，
        再将寒髓散混入药酒。案件已经结束，但你的生活仍会继续。
      </div>
      <button class="main-btn primary wide" id="continueLife">继续生活</button>
    `);

    $("continueLife").onclick=closeModal;
  }else{
    state.suspicion+=2;
    state.factions.guard=Math.max(-10,state.factions.guard-2);
    log("世子案：这次指控无法解释全部证据，幕后之人的警觉提高。");
    forceCloseModal();
    render();
    toast("指控错误，仍可继续调查");
  }
}

function buyProduct(index){
  const product=shopProducts()[index];

  if(product.max||state.coin<product.cost)return;

  state.coin-=product.cost;
  product.buy();
  log(`市集：购买${product.name}。`);
  render();
  openShop();
}
