<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>问道浮生 · v14 生活感 UI 预览</title>
<style>
:root{
  --paper:#f2eadb;
  --paper2:#eadfcd;
  --ink:#2b302c;
  --muted:#746f63;
  --red:#843a31;
  --red2:#5f2823;
  --green:#50675a;
  --line:#c6b89f;
  --gold:#9b743a;
  --soft:#efe4d0;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  margin:0;
  background:#17201c;
  color:var(--ink);
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
}
button{font:inherit}
.shell{
  width:min(100vw,720px);
  height:100dvh;
  margin:auto;
  display:grid;
  grid-template-rows:auto auto minmax(150px,25dvh) auto 1fr;
  background:var(--paper);
  overflow:hidden;
}
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 14px 9px;
  border-bottom:1px solid var(--line);
  background:#efe5d2;
}
.brand h1{
  margin:0;
  color:var(--red);
  font:700 24px/1.1 serif;
}
.version{
  display:inline-block;
  margin-left:5px;
  padding:2px 7px;
  border:1px solid var(--line);
  border-radius:99px;
  background:#fff9ed;
  color:var(--green);
  font:700 11px/1.2 "Microsoft YaHei","PingFang SC",sans-serif;
  vertical-align:middle;
}
.brand p{
  margin:3px 0 0;
  color:var(--muted);
  font-size:11px;
}
.menu{
  width:38px;
  height:38px;
  border:1px solid var(--line);
  border-radius:50%;
  background:#fff9ed;
  color:var(--red);
  font-weight:700;
}
.status{
  display:flex;
  gap:6px;
  align-items:center;
  padding:7px 10px;
  border-bottom:1px solid var(--line);
  background:var(--paper2);
  overflow:hidden;
}
.pill{
  flex:1 1 0;
  min-width:0;
  padding:4px 5px;
  border:1px solid #c9bda7;
  border-radius:99px;
  background:#fff8eb;
  text-align:center;
  white-space:nowrap;
}
.pill b{
  color:var(--red2);
  font-size:12px;
}
.pill span{
  margin-left:2px;
  color:var(--muted);
  font-size:9px;
}
.minor{
  flex:.85 1 0;
  color:var(--muted);
  font-size:10px;
  text-align:center;
  white-space:nowrap;
}
.desk{
  min-height:0;
  padding:11px 14px 10px;
  border-bottom:1px solid var(--line);
  background:#f8f0e3;
  overflow:hidden;
}
.desk-meta{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-bottom:6px;
  color:var(--gold);
  font-size:11px;
}
.desk h2{
  margin:0 0 7px;
  color:var(--red2);
  font:600 21px/1.18 serif;
}
.desk-text{
  color:#444941;
  font-size:13px;
  line-height:1.5;
  max-height:58px;
  overflow:hidden;
}
.desk-note{
  margin-top:8px;
  padding-left:8px;
  border-left:3px solid var(--green);
  color:#4f5b52;
  font-size:12px;
  line-height:1.4;
}
.tabs{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:0;
  border-bottom:1px solid var(--line);
  background:#ded2bd;
}
.tab{
  min-height:42px;
  border:0;
  border-right:1px solid #c2b49a;
  background:transparent;
  color:#4e514b;
  font-size:12px;
  font-weight:700;
}
.tab:last-child{border-right:0}
.tab.active{
  color:var(--red2);
  background:#ead2c8;
  box-shadow:inset 0 -2px 0 var(--red);
}
.panel{
  min-height:0;
  padding:12px 14px calc(12px + var(--safe-bottom));
  overflow:auto;
  background:var(--paper);
}
.panel h3{
  margin:0 0 8px;
  color:var(--red2);
  font:600 19px serif;
}
.lead{
  margin:0 0 12px;
  color:#4a4e48;
  font-size:14px;
  line-height:1.65;
}
.quiet{
  margin:0 0 12px;
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
}
.choice{
  width:100%;
  display:grid;
  grid-template-columns:38px 1fr auto;
  gap:9px;
  align-items:center;
  min-height:52px;
  margin-bottom:8px;
  padding:8px 9px;
  border:1px solid #a99b84;
  border-radius:8px;
  background:#fff9ed;
  text-align:left;
}
.icon{
  display:grid;
  place-items:center;
  width:36px;
  height:36px;
  border:1px solid #b9a98c;
  border-radius:8px;
  background:#f1e4d2;
  color:var(--red2);
  font-weight:700;
}
.choice strong{
  display:block;
  color:var(--red2);
  font-size:14px;
}
.choice small{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:11px;
  line-height:1.35;
}
.cost{
  color:var(--green);
  font-size:11px;
  white-space:nowrap;
  font-style:normal;
}
.storyline{
  margin:0 0 10px;
  padding:0 0 0 13px;
  border-left:1px solid #c9bda7;
}
.storyline p{
  margin:0 0 10px;
  color:#4a4e48;
  font-size:13px;
  line-height:1.62;
}
.thin-card{
  margin-bottom:9px;
  padding:9px 10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff9ed;
}
.thin-card b{
  display:block;
  margin-bottom:3px;
  color:var(--red2);
  font-size:14px;
}
.thin-card small{
  display:block;
  color:var(--muted);
  line-height:1.5;
}
.pair{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.statgrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}
.stat{
  padding:7px 5px;
  border:1px solid #d0c0a7;
  border-radius:7px;
  background:#fff9ed;
  text-align:center;
}
.stat b{display:block;color:var(--red2)}
.stat span{color:var(--muted);font-size:10px}
@media(max-width:430px){
  .pair{grid-template-columns:1fr}
}
@media(max-height:700px){
  .shell{grid-template-rows:auto auto minmax(132px,23dvh) auto 1fr}
  .brand h1{font-size:21px}
  .desk h2{font-size:19px}
  .desk-text{max-height:40px}
  .choice small{display:none}
  .minor{display:none}
}
</style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div class="brand">
      <h1>问道浮生 <span class="version">v14 UI 预览</span></h1>
      <p>生活摘要 + 统一导航 + 更少卡片</p>
    </div>
    <button class="menu">存</button>
  </header>

  <section class="status">
    <div class="pill"><b>186</b><span>铜钱</span></div>
    <div class="pill"><b>10</b><span>食物</span></div>
    <div class="pill"><b>82</b><span>健康</span></div>
    <div class="pill"><b>4/5</b><span>行动</span></div>
    <div class="minor">凡身 58/100 · 灵石 3</div>
  </section>

  <section class="desk">
    <div class="desk-meta">
      <span id="deskPlace">青石城 · 东街</span>
      <span id="deskTime">午后，雨将至</span>
    </div>
    <h2 id="deskTitle">钱还差四十二文</h2>
    <div class="desk-text" id="deskText">
      饭馆旧门板被风吹得轻响。沈祈今天没来店里，老罗倒是在门口停了一会儿，说茶摊那边有人问起北坡废亭。
    </div>
    <div class="desk-note" id="deskNote">今日建议：先去茶馆打听消息，或补一批食材，免得明日饭馆停灶。</div>
  </section>

  <nav class="tabs">
    <button class="tab active" data-view="action">行动</button>
    <button class="tab" data-view="manage">经营</button>
    <button class="tab" data-view="people">人物</button>
    <button class="tab" data-view="bag">背包</button>
    <button class="tab" data-view="record">记录</button>
  </nav>

  <section class="panel" id="panel"></section>
</main>

<script>
const panel = document.getElementById("panel");
const desk = {
  action:["青石城 · 东街","午后，雨将至","钱还差四十二文","饭馆旧门板被风吹得轻响。沈祈今天没来店里，老罗倒是在门口停了一会儿，说茶摊那边有人问起北坡废亭。","今日建议：先去茶馆打听消息，或补一批食材，免得明日饭馆停灶。"],
  manage:["青石城 · 饭馆","灶火刚灭","锅底还留着一点热气","午后来了三个脚夫，其中一人问起北坡的路。伙计阿槐把账记错了一笔，好在发现得早。","经营提醒：食材只够两日，若不补货，后日饭馆会停灶。"],
  people:["青石城 · 茶摊","傍晚，人声渐低","有人把药碗推到你手边","沈祈今天没有问你去了哪里，只把药碗往你手边推了推。燕娘看见了，却像什么都没看见。","人物提醒：沈祈有新见闻，燕娘可打听北坡传闻。"],
  bag:["青石城 · 小院","夜里，灯油将尽","你把东西摊在桌上","干粮、旧锁甲、北坡线索被你一件件摆开。东西不多，却已经能看出你这几日走过的路。","背包提醒：北坡线索可交给沈祈或留到首战前分析。"],
  record:["青石城 · 旧屋","入夜，账本未合","今日的事还没有写完","你在浮生录里记下饭馆收入、沈祈的沉默、北坡的低吼。明日醒来，这些会变成新的选择。","记录提醒：阶段主线仍是经营第一处建筑，并修行至感气边缘。"]
};
const pages = {
  action: `
    <h3>今天能做什么</h3>
    <p class="lead">行动页只放当前可做的事。具体属性、背包、旧记录不在这里抢注意力。</p>
    <button class="choice"><span class="icon">茶</span><span><strong>去茶摊打听</strong><small>燕娘可能知道北坡传闻，也可能介绍新客人。</small></span><em class="cost">0 行动</em></button>
    <button class="choice"><span class="icon">货</span><span><strong>采购食材</strong><small>花 18 铜钱，饭馆食材 +10。</small></span><em class="cost">1 行动</em></button>
    <button class="choice"><span class="icon">修</span><span><strong>旧屋吐纳</strong><small>修为 +12，心性 +1。</small></span><em class="cost">1 行动</em></button>
    <button class="choice"><span class="icon">日</span><span><strong>结束一天</strong><small>弹出每日结算，显示收入、消耗、见闻和明日建议。</small></span><em class="cost">结算</em></button>
  `,
  manage: `
    <h3>饭馆经营</h3>
    <p class="quiet">经营页减少大块卡片，只保留当前建筑、经营状态和几个关键操作。</p>
    <div class="storyline">
      <p><b>昨日：</b>饭馆收入 31 铜钱，食材 -4。两个脚夫说汤淡，一个商队伙计问起北坡路。</p>
      <p><b>今日：</b>库存还够两日。阿槐说自己会算账，但刚刚把三十文写成了十三文。</p>
    </div>
    <div class="pair">
      <div class="thin-card"><b>饭馆 Lv.1</b><small>库存：食材 8<br>口碑：2｜伙计：阿槐</small></div>
      <div class="thin-card"><b>可买建筑</b><small>茶馆 165 铜钱<br>药铺 195 铜钱</small></div>
    </div>
    <button class="choice"><span class="icon">扫</span><span><strong>打理门面</strong><small>口碑 +1，阿槐会观察你的做事方式。</small></span><em class="cost">1 行动</em></button>
    <button class="choice"><span class="icon">雇</span><span><strong>再招一名伙计</strong><small>可能遇到凡人、修士或麻烦人物。</small></span><em class="cost">1 行动</em></button>
  `,
  people: `
    <h3>人物名册</h3>
    <p class="quiet">人物页保留关系数值，但每个人必须有一句动态生活反馈。</p>
    <div class="thin-card"><b>沈祈｜药行跑腿</b><small>信任 12｜亲近 6｜分歧 1<br>他今天没问你去了哪里，只把药碗往你手边推了推。</small></div>
    <button class="choice"><span class="icon">问</span><span><strong>问沈祈外伤消息</strong><small>可能获得北坡准备线索。</small></span><em class="cost">0 行动</em></button>
    <div class="thin-card"><b>燕娘｜茶摊老板</b><small>信任 5｜亲近 2<br>她说客人话多，但愿意付茶钱的人更少。</small></div>
    <button class="choice"><span class="icon">茶</span><span><strong>请燕娘留意新客</strong><small>明日可能出现随机 NPC。</small></span><em class="cost">0 行动</em></button>
    <div class="thin-card"><b>老罗｜脚夫头</b><small>信任 8｜亲近 3<br>他替你看过东街空铺，说门板旧但灶台能用。</small></div>
  `,
  bag: `
    <h3>背包与状态</h3>
    <p class="quiet">背包保留为常驻入口，同时把境界、灵石、装备放在这里，不挤占顶部。</p>
    <div class="statgrid">
      <div class="stat"><b>凡身</b><span>境界</span></div>
      <div class="stat"><b>58/100</b><span>修为</span></div>
      <div class="stat"><b>3</b><span>灵石</span></div>
      <div class="stat"><b>82</b><span>血量</span></div>
      <div class="stat"><b>16</b><span>体魄</span></div>
      <div class="stat"><b>14</b><span>社交</span></div>
    </div>
    <div class="storyline">
      <p><b>干粮 x2：</b>够撑一段短路，不能让你长期无视食物。</p>
      <p><b>旧锁甲 x1：</b>不体面，但能挡住山兽第一下撞击。</p>
      <p><b>北坡线索 x1：</b>废亭旁有新鲜血痕，适合战斗前分析。</p>
    </div>
  `,
  record: `
    <h3>浮生录</h3>
    <p class="quiet">记录页使用连续时间线，减少卡片堆叠感。</p>
    <div class="storyline">
      <p><b>清晨：</b>阿槐把饭馆门板擦了一遍，说自己昨夜梦见有人敲后门。</p>
      <p><b>午后：</b>老罗带来两个脚夫，其中一人问起北坡废亭的路。</p>
      <p><b>傍晚：</b>沈祈没有多问，只留下药碗。你看见他袖口有一点暗红药渍。</p>
      <p><b>当前主线：</b>经营第一处建筑，修行至感气边缘，并决定是否调查北坡兽影。</p>
    </div>
  `
};
function setView(name){
  panel.innerHTML = pages[name];
  const d = desk[name];
  document.getElementById("deskPlace").textContent = d[0];
  document.getElementById("deskTime").textContent = d[1];
  document.getElementById("deskTitle").textContent = d[2];
  document.getElementById("deskText").textContent = d[3];
  document.getElementById("deskNote").textContent = d[4];
  document.querySelectorAll(".tab").forEach(btn => btn.classList.toggle("active", btn.dataset.view === name));
}
document.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => setView(btn.dataset.view)));
setView("action");
</script>
</body>
</html>
